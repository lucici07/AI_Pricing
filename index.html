<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font:14px/1.5 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#F3F5F9}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>GA Repricing Platform</title>
<meta name="description" content="Clickable prototype: the RPT repricing tool embedded in LBP, a separate PowerApps Tracker, and Power BI reporting — over shared bid and account state.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#F3F5F9; --surface:#FFFFFF; --surface-2:#EDF0F6;
    --border:#D9DFEA; --border-strong:#C1C9D9;
    --ink:#15233F; --ink-2:#45516A; --muted:#6C7689;
    --navy:#1C2C4E; --brand:#D51E28; --brand-ink:#A9151D;
    --info:#2E5AAC; --info-bg:#E7EEFA;
    --good:#1C7C4A; --good-bg:#E2F1E8;
    --warn:#A96A08; --warn-bg:#FAF0DE;
    --bad:#BF3B30; --bad-bg:#FBE8E5;
    --yellow:#C9971B; --yellow-bg:#FBF2DA;
    --shadow:0 1px 2px rgba(21,35,63,.05), 0 8px 24px -16px rgba(21,35,63,.18);
    --fs-display:"Newsreader",Georgia,"Times New Roman",serif;
    --fs-sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --fs-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0D1524; --surface:#141F35; --surface-2:#1D2B47;
      --border:#2B3B58; --border-strong:#3C4F72;
      --ink:#ECF0F8; --ink-2:#BAC4D7; --muted:#8A95AC;
      --navy:#25375D; --brand:#F0474F; --brand-ink:#F0474F;
      --info:#77A4EE; --info-bg:#182A47;
      --good:#48B57E; --good-bg:#12301F;
      --warn:#E0A445; --warn-bg:#33270F;
      --bad:#E9695C; --bad-bg:#331A16;
      --yellow:#E3B84D; --yellow-bg:#332912;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0D1524; --surface:#141F35; --surface-2:#1D2B47;
    --border:#2B3B58; --border-strong:#3C4F72;
    --ink:#ECF0F8; --ink-2:#BAC4D7; --muted:#8A95AC;
    --navy:#25375D; --brand:#F0474F; --brand-ink:#F0474F;
    --info:#77A4EE; --info-bg:#182A47;
    --good:#48B57E; --good-bg:#12301F;
    --warn:#E0A445; --warn-bg:#33270F;
    --bad:#E9695C; --bad-bg:#331A16;
    --yellow:#E3B84D; --yellow-bg:#332912;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--fs-sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{margin:0;text-wrap:balance;}
  button,input,select,textarea{font-family:inherit;}
  a{color:var(--info);}

  .topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);}
  .topbar .rule{height:3px;background:var(--brand);}
  .topbar .inner{max-width:1440px;margin:0 auto;padding:11px 22px 0;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .wordmark{display:flex;align-items:baseline;gap:9px;}
  .wordmark b{font-family:var(--fs-display);font-weight:600;font-size:20px;}
  .wordmark span{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:600;}
  .top-actions{margin-left:auto;display:flex;gap:9px;align-items:center;}
  .btn-plain{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);border-radius:7px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;}
  .btn-plain:hover{border-color:var(--brand);color:var(--brand);}
  .tabs{max-width:1440px;margin:0 auto;padding:6px 22px 0;display:flex;gap:4px;}
  .tab{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:9px 15px;border-radius:8px 8px 0 0;cursor:pointer;border-bottom:2px solid transparent;}
  .tab:hover{color:var(--ink);}
  .tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);background:var(--surface-2);}
  .tab .n{font-family:var(--fs-mono);font-size:10px;background:var(--brand);color:#fff;border-radius:9px;padding:0 5px;margin-left:5px;}

  .shell{max-width:1440px;margin:0 auto;padding:18px 22px 60px;}
  .roles{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .roles .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-right:4px;}
  .role-seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;flex-wrap:wrap;}
  .role-seg button{border:0;border-right:1px solid var(--border);background:var(--surface);color:var(--ink-2);padding:7px 13px;font-size:12.5px;font-weight:500;cursor:pointer;}
  .role-seg button:last-child{border-right:0;}
  .role-seg button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:600;}
  :root[data-theme="dark"] .role-seg button[aria-pressed="true"]{color:#0D1524;background:var(--info);}

  .lede{color:var(--ink-2);font-size:13px;margin:-4px 0 16px;max-width:80ch;}
  .lede b{color:var(--ink);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;}
  .card > h3{padding:12px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
  .card > h3 .plat{margin-left:auto;font-family:var(--fs-mono);font-weight:400;letter-spacing:0;text-transform:none;font-size:10px;}
  .card .pad{padding:16px;}
  .appwin{border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;}
  .appwin > .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--navy);color:#fff;font-size:12px;font-weight:600;}
  .appwin > .bar .dots{display:flex;gap:5px;}
  .appwin > .bar .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);}
  .appwin > .bar .plat{margin-left:auto;font-family:var(--fs-mono);font-weight:400;font-size:11px;opacity:.85;}
  .appwin > .body{padding:16px;background:var(--surface);}

  /* LBP chrome */
  .lbpbar{display:flex;align-items:center;gap:12px;background:var(--brand);color:#fff;padding:9px 16px;border-radius:10px 10px 0 0;}
  .lbpbar .lg{font-family:var(--fs-display);font-weight:600;font-size:15px;letter-spacing:.3px;}
  .lbpbar .sr{margin-left:auto;background:rgba(255,255,255,.16);border-radius:6px;padding:4px 10px;font-size:11px;font-family:var(--fs-mono);}
  .lbpwrap{border:1px solid var(--border-strong);border-top:0;border-radius:0 0 10px 10px;background:var(--surface);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);color:var(--ink);font-size:13px;}
  .field textarea{resize:vertical;min-height:66px;line-height:1.45;}
  .field .ro{padding:8px 10px;border:1px dashed var(--border-strong);border-radius:7px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;font-family:var(--fs-mono);}
  :focus-visible{outline:2px solid var(--info);outline-offset:1px;}

  .btn{border:0;border-radius:8px;padding:9px 17px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
  .btn.primary{background:var(--brand);color:#fff;}
  .btn.primary:hover{background:var(--brand-ink);}
  .btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--border-strong);}
  .btn.ghost:hover{border-color:var(--info);color:var(--info);}
  .btn.ok{background:var(--good);color:#fff;}
  .btn.danger{background:var(--surface);color:var(--bad);border:1px solid var(--bad);}
  .btn.sm{padding:6px 11px;font-size:12px;}
  .btn:disabled{opacity:.42;cursor:not-allowed;}
  .btn .lock{font-size:12px;}

  .callout{border-radius:9px;padding:11px 13px;font-size:12.5px;line-height:1.5;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);}
  .callout.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 30%,transparent);color:var(--ink);}
  .callout.good{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 30%,transparent);}
  .callout.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent);}
  .callout.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 35%,transparent);}
  .callout b{color:var(--ink);}
  .tiny{font-size:11px;color:var(--muted);}
  .mono{font-family:var(--fs-mono);}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
  .pill.good{background:var(--good-bg);color:var(--good);}
  .pill.warn{background:var(--warn-bg);color:var(--warn);}
  .pill.bad{background:var(--bad-bg);color:var(--bad);}
  .pill.info{background:var(--info-bg);color:var(--info);}
  .pill.yellow{background:var(--yellow-bg);color:var(--yellow);}
  .pill.mut{background:var(--surface-2);color:var(--muted);}

  table.sheet{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.sheet th,table.sheet td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;}
  table.sheet th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;}
  table.sheet td.num,table.sheet th.num{text-align:right;font-family:var(--fs-mono);font-variant-numeric:tabular-nums;}
  table.sheet tr:last-child td{border-bottom:0;}
  table.sheet .total td{font-weight:700;background:var(--surface-2);}
  table.sheet tbody tr.click{cursor:pointer;}
  table.sheet tbody tr.click:hover{background:var(--surface-2);}

  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
  .stat{border:1px solid var(--border);border-radius:10px;padding:13px 14px;background:var(--surface);}
  .stat .v{font-family:var(--fs-display);font-weight:600;font-size:25px;line-height:1;}
  .stat .l{font-size:11px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.04em;}
  .stat .s{font-size:11px;color:var(--ink-2);margin-top:2px;font-family:var(--fs-mono);}

  /* worklist */
  .wl{display:flex;flex-direction:column;gap:8px;}
  .wlrow{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;border:1px solid var(--border-strong);border-radius:10px;padding:11px 13px 11px 0;background:var(--surface);}
  .wlrow .stripe{align-self:stretch;border-radius:10px 0 0 10px;background:var(--border-strong);}
  .wlrow.rpg .stripe{background:var(--info);}
  .wlrow.exc .stripe{background:var(--yellow);}
  .wlrow.done .stripe{background:var(--good);}
  .wlrow.rej .stripe{background:var(--bad);}
  .wlrow .m1{font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .wlrow .m2{font-size:11.5px;color:var(--muted);font-family:var(--fs-mono);margin-top:2px;}
  .wlrow .acts{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}

  /* board */
  .board{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start;}
  .blist{display:flex;flex-direction:column;gap:6px;max-height:640px;overflow-y:auto;padding-right:2px;}
  .brow{display:grid;grid-template-columns:6px 1fr auto;gap:10px;align-items:center;border:1px solid var(--border-strong);border-radius:9px;padding:10px 12px 10px 0;cursor:pointer;background:var(--surface);}
  .brow:hover{border-color:var(--info);}
  .brow.sel{border-color:var(--ink);box-shadow:0 0 0 2px color-mix(in srgb,var(--ink) 18%,transparent);}
  .brow .stripe{align-self:stretch;border-radius:9px 0 0 9px;}
  .brow.yellow .stripe{background:var(--yellow);}
  .brow.blue .stripe{background:var(--info);}
  .brow.green .stripe{background:var(--good);}
  .brow.red .stripe{background:var(--bad);}
  .brow.grey .stripe{background:var(--border-strong);}
  .brow .nm{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;}
  .brow .meta{font-size:11px;color:var(--muted);font-family:var(--fs-mono);}
  .brow .unread{width:8px;height:8px;border-radius:50%;background:var(--brand);flex-shrink:0;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:8px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .bdetail{border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;}
  .bdetail .dhead{padding:14px 18px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--surface),var(--surface-2));}
  .bdetail .dhead h3{font-family:var(--fs-display);font-weight:600;font-size:20px;}
  .bdetail .dhead .sub{font-size:12px;color:var(--muted);margin-top:2px;font-family:var(--fs-mono);}
  .bdetail .dbody{padding:18px;display:flex;flex-direction:column;gap:14px;}

  .matlist{display:flex;flex-direction:column;gap:6px;}
  .matlist .m{display:flex;align-items:center;gap:8px;font-size:12px;font-family:var(--fs-mono);border:1px solid var(--border);border-radius:7px;padding:7px 10px;background:var(--surface-2);}

  .checks{display:flex;flex-direction:column;}
  .check{display:grid;grid-template-columns:22px 1fr;gap:11px;align-items:start;padding:10px 4px;border-bottom:1px solid var(--border);}
  .check:last-child{border-bottom:0;}
  .check .ico{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);border:1.5px solid var(--border-strong);}
  .check.run .ico{border-color:var(--info);color:var(--info);animation:spin 1s linear infinite;}
  .check.pass .ico{background:var(--good);border-color:var(--good);color:#fff;}
  .check .lab{font-weight:600;font-size:13px;}
  .check .det{font-size:11.5px;color:var(--muted);margin-top:2px;font-family:var(--fs-mono);line-height:1.4;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){.check.run .ico{animation:none;}}
  .lineflag{background:var(--warn-bg);}

  .notebox{white-space:pre-wrap;font-family:var(--fs-mono);font-size:11px;line-height:1.6;border:1px solid var(--border-strong);border-radius:8px;padding:11px;background:var(--surface-2);color:var(--ink);max-height:230px;overflow:auto;}

  .kpi-rows{width:100%;border-collapse:collapse;font-size:12px;}
  .kpi-rows th,.kpi-rows td{padding:6px;border-bottom:1px solid var(--border);}
  .kpi-rows th{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .kpi-rows input{width:100%;padding:5px 6px;border:1px solid var(--border-strong);border-radius:5px;background:var(--surface);color:var(--ink);font-family:var(--fs-mono);font-size:12px;text-align:right;}
  .kpi-rows .del{border:0;background:0;color:var(--muted);cursor:pointer;font-size:13px;}
  .kpi-table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .kpi-table th,.kpi-table td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--border);}
  .kpi-table th:first-child,.kpi-table td:first-child{text-align:left;}
  .kpi-table td{font-family:var(--fs-mono);font-variant-numeric:tabular-nums;}
  .kpi-table .metric{font-family:var(--fs-sans);font-weight:600;}

  /* tree / treemap */
  .tree{display:flex;align-items:stretch;overflow-x:auto;padding:6px 0;}
  .tcol{display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:170px;}
  .tcol.links{min-width:30px;}
  .tnode{border:1px solid var(--border-strong);border-radius:9px;padding:10px 12px;background:var(--surface);}
  .tnode.root{background:var(--navy);color:#fff;border-color:var(--navy);}
  .tnode .tn-l{font-size:11px;text-transform:uppercase;letter-spacing:.04em;opacity:.85;}
  .tnode .tn-v{font-family:var(--fs-display);font-weight:600;font-size:21px;line-height:1.1;}
  .tnode .tn-bar{height:6px;border-radius:4px;background:var(--surface-2);margin-top:7px;overflow:hidden;}
  .tnode .tn-bar i{display:block;height:100%;border-radius:4px;}
  .lwrap{display:flex;flex-direction:column;justify-content:space-around;height:100%;}
  .lwrap .link{flex:1;border-bottom:1px solid var(--border-strong);}
  .treemap{display:flex;flex-wrap:wrap;gap:8px;}
  .tm{border:1px solid var(--border-strong);border-radius:9px;padding:11px;background:var(--surface);min-width:150px;flex:1;}
  .tm h4{font-size:13px;display:flex;justify-content:space-between;align-items:baseline;}
  .tm h4 span{font-family:var(--fs-mono);font-size:11px;color:var(--muted);}
  .tm .stack{display:flex;height:14px;border-radius:5px;overflow:hidden;margin:9px 0 7px;background:var(--surface-2);}
  .tm .stack i{height:100%;}
  .tm .key{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:10.5px;color:var(--muted);}
  .tm .key span{display:inline-flex;align-items:center;gap:4px;}
  .tm .key b{width:8px;height:8px;border-radius:2px;display:inline-block;}
  .filterbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;}
  .filterbar .field{min-width:140px;}

  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  .stack{display:flex;flex-direction:column;gap:16px;}

  .scrim{position:fixed;inset:0;background:rgba(10,16,30,.45);z-index:50;display:flex;justify-content:flex-end;}
  .drawer{width:min(400px,92vw);background:var(--surface);height:100%;box-shadow:-12px 0 40px -20px rgba(0,0,0,.5);display:flex;flex-direction:column;}
  .drawer .dh{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:700;}
  .drawer .dh .x{margin-left:auto;cursor:pointer;color:var(--muted);border:0;background:0;font-size:16px;}
  .drawer .dc{overflow-y:auto;padding:8px 0;flex:1;}
  .li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 16px;font-size:12px;line-height:1.4;}
  .li time{font-family:var(--fs-mono);font-size:10px;color:var(--muted);padding-top:2px;}
  .li b{color:var(--ink);}
  .li.acc{border-left:2px solid var(--brand);}

  .modal-scrim{position:fixed;inset:0;background:rgba(10,16,30,.5);z-index:55;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);}
  .modal .mh{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
  .modal .mh h3{font-family:var(--fs-display);font-weight:600;font-size:18px;}
  .modal .mh .x{margin-left:auto;cursor:pointer;color:var(--muted);border:0;background:0;font-size:17px;}
  .modal .mb{padding:20px;display:flex;flex-direction:column;gap:14px;}

  .toast-wrap{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;flex-direction:column;gap:9px;}
  .toast{background:var(--navy);color:#fff;border-radius:9px;padding:11px 15px;font-size:13px;box-shadow:0 12px 32px -12px rgba(0,0,0,.5);max-width:330px;display:flex;gap:9px;align-items:flex-start;animation:rise .3s ease;}
  .toast .x{margin-left:auto;cursor:pointer;opacity:.7;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

function stamp(){ clock+=40+Math.floor(Math.random()*120); const h=Math.floor(clock/3600)%24,m=Math.floor(clock/60)%60,s=clock%60; return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`; }
function todayStamp(){ return "09-08 "+stamp().slice(0,5); }
function log(html,isAcc){ S.log.unshift({t:stamp(),html,acc:!!isAcc}); if($("#logBody")) renderLogDrawer(); }
function toast(html){ const w=$("#toasts"); const t=document.createElement("div"); t.className="toast";

  w.appendChild(t); setTimeout(()=>t.remove(),6000); }
function copyText(text){ try{ if(navigator&&navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text); }catch(e){} }
const money=v=>"$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const m2=v=>"$"+(v/1e6).toFixed(2)+"M";
const pp=v=>(v>=0?"+":"")+v.toFixed(2)+" pp";
const pct=(n,d)=>d?Math.round(n/d*100)+"%":"0%";

const B=id=>S.bids.find(b=>b.id===id);

const hasManual=l=>l.manualPrice!=null&&String(l.manualPrice).trim()!=="";
function linePrice(l){ if(hasManual(l))return +l.manualPrice; return l.flag?null:l.newPrice; }
function lineCost(l){ return l.flag?l.newPrice*(1-0.14):l.newPrice*(1-(l.marginPct||0)/100); }
function lineMargin(l){ const p=linePrice(l); if(p==null)return null;
  if(hasManual(l)){ const c=lineCost(l); return +(((p-c)/p)*100).toFixed(1); }
  return l.flag?null:l.marginPct; }
function bidMargin(b){ let rev=0,gp=0,any=false;
  b.lines.forEach(l=>{ const mg=lineMargin(l),p=linePrice(l); if(mg==null||p==null)return;
    any=true; const r=p*l.qty; rev+=r; gp+=r*mg/100; });
  return any?+(gp/rev*100).toFixed(1):null; }

function pricingNote(b){
  const a=bidAcct(b);
  const rows=b.lines.map(l=>{ const p=linePrice(l);
    return `${l.pn} | prev ${money(l.base)} | ${l.memory} | ${l.ssd} (${l.cpu}) = ${p!=null?money(p):"manual $ pending"}`; });
  const bm=bidMargin(b);
  return `Repricing · ${a.name} · ${b.id} · ${a.geo}/${a.vertical} · GTP FY26 Aug (+10%)\n`+rows.join("\n")+
    `\nBlended margin ${bm==null?"—":bm.toFixed(1)+"%"}`+(b.pricerNote?`\n\nNotes: ${b.pricerNote}`:"");
}
function excCaseNote(a){
  const e=a.exception;

    `Performance: ${e.performance||"(not yet compiled)"}\nMaterials: ${(e.materials||[]).join(", ")||"none"}`;
}
function kpiNote(a){
  const e=a.exception, k=e.calc;
  const base=BASELINE.find(x=>x.geo===a.geo&&x.vertical===a.vertical)||BASELINE.find(x=>x.geo===a.geo)||BASELINE[0];
  return `Exception KPI impact · ${a.name} · ${a.geo}/${a.vertical}\nBaseline: REV ${m2(base.rev)} · TMCGP ${m2(base.tmcgp)} (${(base.tmcgp/base.rev*100).toFixed(2)}%)\n`+
    (k?`With new deal: TMCGP% ${k.totPct.toFixed(2)}% · ${pp(k.bwPct)} vs MT ${MT_TARGET.toFixed(1)}%`:"KPI not yet calculated")+
    `\nPM case: ${e.performance||"—"}`;
}
const canRPT=role=>["pricer","pm","director"].includes(role);
const rptRecord=(bidId,role)=>S.rptRecords.find(r=>r.bidId===bidId&&r.role===role);

function computeReport(list){
  const total=list.length;
  const active=list.filter(a=>a.active===true);
  const notActive=list.filter(a=>a.active===false);
  const b={full:0,partial:0,none:0,missing:0};
  active.forEach(a=>{ if(a.guidance==="Full")b.full++; else if(a.guidance==="Partial")b.partial++;
    else if(a.guidance==="None")b.none++; else b.missing++; });
  return {total,active:active.length,notActive:notActive.length,b,
    exceptions:list.filter(a=>a.track==="Exception"),
    missing:list.filter(a=>a.active===true&&!a.guidance)};
}
function runCalc(accId){
  const a=A(accId);
  const base=BASELINE.find(x=>x.geo===a.geo&&x.vertical===a.vertical)||BASELINE.find(x=>x.geo===a.geo)||BASELINE[0];
  const rows=S.calc.rows;
  const newRev=rows.reduce((s,r)=>s+(+r.rev||0),0);
  const newTmcgp=rows.reduce((s,r)=>s+(+r.rev||0)*(+r.t||0)/100,0);
  const totRev=base.rev+newRev, totTmcgp=base.tmcgp+newTmcgp;
  const basePct=base.tmcgp/base.rev*100;
  const newPct=newRev?newTmcgp/newRev*100:0;
  const totPct=totRev?totTmcgp/totRev*100:0;
  const out={base,baseRev:base.rev,baseTmcgp:base.tmcgp,newRev,newTmcgp,totRev,totTmcgp,basePct,newPct,totPct,bwPct:totPct-MT_TARGET};
  S.calc.out=out; S.calc.acctId=accId; return out;
}

/* board colour */
function boardColor(a,role){
  if(a.track==="RPG") return "blue";
  if(a.track==="Exception"&&a.exception){

    if(st==="Rejected") return "red";
    if(role==="pm"&&st==="PM-intake") return "yellow";
    if(role==="director"&&st==="Director-review") return "yellow";
    return "grey";
  }
  return "grey";
}

const sortedBoard=role=>[...S.accounts].filter(a=>a.track)

function lbpSale(){
  const book=S.saleBook;
  const accOpts=S.accounts.filter(a=>a.mgr===book).map(a=>`<option value="${a.id}">${a.name} · ${a.geo} · ${a.vertical}${a.track?` (in ${a.track})`:""}</option>`).join("");
  const sa=S.sel.saleAcct||S.accounts.find(a=>a.mgr===book).id;
  const wl=S.bids.filter(b=>{const a=bidAcct(b); return a.mgr===book && (b.lbpStatus==="sale-confirm" || (b.lbpStatus==="closed" && a.unread.sale));});
  return `
  <div class="grid2">
    <div class="card" style="box-shadow:none">
      <h3>New bid request <span class="plat">My Bid Requests</span></h3>
      <div class="pad stack">
        <div class="grid2">
          <div class="field"><label>Sales Rep book</label>
            <select data-input="saleBook">${SALE_MGRS.map(m=>`<option ${m===book?"selected":""}>${m}</option>`).join("")}</select></div>
          <div class="field"><label>Account</label>
            <select data-input="saleAcct">${accOpts.replace(`value="${sa}"`,`value="${sa}" selected`)}</select></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Bid Request Type</label>
            <select data-input="brType"><option>Renewal</option><option>New Business</option><option>Repricing</option></select></div>
          <div class="field"><label>Fulfillment Method</label>
            <select data-input="brFul"><option>Direct</option><option>T1 Partner</option></select></div>
        </div>
        <div class="field"><label>Description — type <span class="mono">RPG</span> or <span class="mono">Exception</span></label>
          <textarea data-input="brDesc" placeholder="e.g. RPG — Q1 renewal, 120 units, full per guidance">${esc(S._brDesc||"")}</textarea></div>
        <div class="field"><label>Lines (from PN list)</label><div class="ro">${CATALOG.slice(0,3).map(c=>c.pn).join(" · ")}</div></div>
        <div><button class="btn primary" data-act="lbp-submit">Submit bid request</button></div>
        <div class="tiny">The platform reads the Description: “exception” anywhere → Exception lane (a <b>Sync to Tracker</b> window opens right away); otherwise RPG → the bid goes to a Pricer.</div>
      </div>
    </div>
    <div class="card" style="box-shadow:none">
      <h3>My Work List <span class="plat">${wl.length} need confirm</span></h3>
      <div class="pad">
        ${wl.length? `<div class="wl">${wl.map(b=>{ const a=bidAcct(b);
          const done=b.lbpStatus==="closed";
          return `<div class="wlrow ${done?(b.decision==="Rejected"?"rej":"done"):(b.type==="Exception"?"exc":"rpg")}">
            <span class="stripe"></span>
            <span><span class="m1">${a.name} ${b.type==="Exception"?`<span class="pill yellow">Exception</span>`:`<span class="pill info">RPG</span>`} ${done?decisionPill(b.decision):""}</span>
              <span class="m2">${b.id} · ${esc(b.description)}</span></span>
            <span class="acts">
              ${done? `<button class="btn ghost sm" data-act="sale-open-result" data-id="${b.id}">Open result</button>`
                : `<button class="btn primary sm" data-act="sale-confirm-open" data-id="${b.id}">Confirm</button>`}
            </span></div>`; }).join("")}</div>`
          : `<div class="callout good">Nothing waiting on you. When a Pricer approves an RPG bid, or an exception is decided, it lands here to confirm.</div>`}
        <div class="callout" style="margin-top:12px">🔒 <b>RPT is not available to Sale</b> — it's a Pricer / PM / Director tool.</div>
      </div>
    </div>
  </div>`;
}

function lbpQueue(role,status){
  return S.bids.filter(b=>b.lbpStatus===status);
}
function wlRow(b,role){
  const a=bidAcct(b);
  const rec=rptRecord(b.id,role);
  const kls=b.type==="Exception"?"exc":"rpg";
  let acts="";
  if(role==="pricer"){
    acts=`<button class="btn ghost sm" data-act="rpt-open" data-id="${b.id}" data-role="pricer">${rec?"Reopen RPT":"Open RPT"}</button>
      ${rec?`<span class="pill mut">RPT ${rec.id}</span>`:""}
      <button class="btn ok sm" data-act="lbp-approve" data-id="${b.id}" ${rec?"":"disabled"}>Approve</button>
      <button class="btn danger sm" data-act="lbp-reject-open" data-id="${b.id}" ${rec?"":"disabled"}>Reject</button>`;
  } else if(role==="pm"){
    acts=`<button class="btn ghost sm" data-act="rpt-open" data-id="${b.id}" data-role="pm">${rec?"Reopen RPT":"Open RPT"}</button>
      ${rec?`<span class="pill mut">RPT ${rec.id}</span>`:""}
      <button class="btn primary sm" data-act="lbp-pm-submit" data-id="${b.id}" ${rec?"":"disabled"}>Submit to Director</button>`;
  } else if(role==="director"){
    acts=`<button class="btn ghost sm" data-act="rpt-open" data-id="${b.id}" data-role="director">${rec?"Reopen RPT":"Open RPT"}</button>
      ${rec?`<span class="pill mut">RPT ${rec.id}</span>`:""}
      <button class="btn ok sm" data-act="lbp-approve" data-id="${b.id}" ${rec?"":"disabled"}>Approve</button>
      <button class="btn danger sm" data-act="lbp-reject-open" data-id="${b.id}" ${rec?"":"disabled"}>Reject</button>`;
  }
  return `<div class="wlrow ${kls}"><span class="stripe"></span>
    <span><span class="m1">${a.name} <span class="pill ${b.type==="Exception"?"yellow":"info"}">${b.type}</span> ${statusPill(b.lbpStatus)}</span>
      <span class="m2">${b.id} · ${a.geo}/${a.vertical} · ${esc(b.description)}</span></span>
    <span class="acts">${acts}</span></div>`;
}

function lbpPricer(){
  const q=lbpQueue("pricer","with-pricer");
  return `
  <div class="card" style="box-shadow:none"><h3>My Work List — RPG bids <span class="plat">${q.length} to price</span></h3>
    <div class="pad">
      ${q.length?`<div class="wl">${q.map(b=>wlRow(b,"pricer")).join("")}</div>`:`<div class="callout good">No RPG bids waiting.</div>`}
      <div class="callout" style="margin-top:12px">Open RPT to run the calc and save a pricing record. <b>Approve / Reject unlock once an RPT record is saved.</b> Approving sends the bid to Sale to confirm.</div>
    </div>
  </div>`;
}
function lbpPM(){
  const q=lbpQueue("pm","with-pm");
  return `
  <div class="card" style="box-shadow:none"><h3>My Work List — Exception intake <span class="plat">${q.length} to compile</span></h3>
    <div class="pad">
      ${q.length?`<div class="wl">${q.map(b=>wlRow(b,"pm")).join("")}</div>`:`<div class="callout good">No exceptions waiting.</div>`}
      <div class="callout" style="margin-top:12px">Open RPT to compile the case (past performance + materials) and save the record. <b>Submit to Director</b> unlocks once the RPT record is saved. Most PM time is other pricing (transition / NPI) handled outside this tool.</div>

  </div>`;
}
function lbpDirector(){
  const q=lbpQueue("director","with-director");
  return `
  <div class="card" style="box-shadow:none"><h3>My Work List — Exceptions for decision <span class="plat">${q.length} to review</span></h3>
    <div class="pad">
      ${q.length?`<div class="wl">${q.map(b=>wlRow(b,"director")).join("")}</div>`:`<div class="callout good">Nothing to decide.</div>`}
      <div class="callout" style="margin-top:12px">Open RPT to see the PM's case + run the KPI impact calculator, then save the record. <b>Approve / Reject unlock once saved</b>; the decision syncs to the Tracker and notifies PM + Sale.</div>
    </div>
  </div>`;
}

function lbpRecords(){
  const q=(S.sel.recSearch||"").toLowerCase();
  const list=S.rptRecords.filter(r=>!q||r.id.toLowerCase().includes(q)||r.account.toLowerCase().includes(q)||r.bidId.toLowerCase().includes(q)||r.role.includes(q));
  return `
  <p class="lede"><b>RPT records.</b> Every “Save record” in RPT lands here — searchable later by anyone. RPT doesn't approve anything; this is the audit trail of what was calculated and noted.</p>
  <div class="card">
    <h3>Saved RPT records <span class="plat">${list.length} / ${S.rptRecords.length}</span></h3>
    <div class="pad">
      <div class="field" style="max-width:280px;margin-bottom:12px"><label>Search — id / account / bid / role</label>
        <input data-input="recSearch" value="${esc(S.sel.recSearch)}" placeholder="e.g. Nike"></div>
      <table class="sheet">
        <thead><tr><th>Record</th><th>Bid</th><th>Account</th><th>Kind</th><th>Saved by</th><th>When</th></tr></thead>
        <tbody>${list.map(r=>`<tr class="click" data-act="rec-view" data-id="${r.id}">
          <td class="mono">${r.id}</td><td class="mono">${r.bidId}</td><td><b>${r.account}</b></td>
          <td>${r.kind.replace("-"," ")}</td><td>${r.savedBy}</td><td class="mono">${r.ts}</td></tr>`).join("")
          || `<tr><td colspan="6" class="tiny">No records match.</td></tr>`}</tbody>
      </table>
    </div>
  </div>`;
}

/* ---------- RPT screen ---------- */
function rptScreen(){
  const b=B(S.rpt.open); const a=bidAcct(b); const role=S.rpt.role;
  const rec=rptRecord(b.id,role);
  let body;
  if(role==="pricer") body=rptPricer(b);
  else if(role==="pm") body=rptPM(b,a);
  else body=rptDirector(b,a);
  const noteText = role==="pricer"?pricingNote(b) : role==="pm"?excCaseNote(a) : kpiNote(a);
  return `
  <div class="appwin">
    <div class="bar"><span class="dots"><i></i><i></i><i></i></span> RPT · Repricing Tool
      <span class="plat">embedded in LBP · ${role} · ${b.id}</span></div>
    <div class="body">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
        <button class="btn ghost sm" data-act="rpt-close">← Back to LBP</button>
        <b style="font-family:var(--fs-display);font-size:18px">${a.name}</b>
        <span class="tiny mono">${a.geo}/${a.vertical} · ${b.type} · ${esc(b.description)}</span>
        <span style="margin-left:auto"></span>
        ${rec?`<span class="pill good">saved · ${rec.id}</span>`:``}
      </div>
      ${body}
      <div class="stack" style="margin-top:16px">
        <div class="field"><label>Pricing note (generated) — one-click copy</label>
          <div class="notebox" id="rpt-note">${esc(S.rpt.ran||rec ? noteText : "Run first to generate the note.")}</div></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${role==="pricer"?`<button class="btn ghost" data-act="rpt-lps" data-id="${b.id}" ${b.lpsSynced?"disabled":""} ${S.rpt.ran?"":"disabled"}>${b.lpsSynced?"✓ Synced to LPS":"↔ Sync to LPS"}</button>`:""}
          <button class="btn ghost" data-act="rpt-copy" data-id="${b.id}" ${S.rpt.ran||rec?"":"disabled"}>⧉ Copy pricing note</button>
          <button class="btn primary" data-act="rpt-save" data-id="${b.id}" ${S.rpt.ran?"":"disabled"}>${rec?"Update saved record":"Save record"}</button>
        </div>
        <div class="callout">RPT does not approve or reject. Saving the record unlocks the decision on the LBP work list.</div>
      </div>
    </div>
  </div>`;
}
function rptPricer(b){
  const steps=[
    ["Bid + comment auto-ingested",`Bid ${b.id} from LBP · comment parsed`],
    ["Auto-fetch ref bid + original price",`ref ${b.lines[0].refBid}`],
    ["Auto-read memory / SSD config",`DDR5 / G4 · G4P resolved per PN`],
    ["Auto-match PN → catalog model",`special CPUs flagged for a manual price`],
    ["Apply guidance uplift · line-by-line margin",`GTP FY26 Aug · +10%`]
  ];
  const ran=S.rpt.ran;
  const checks=steps.map((s,i)=>`<div class="check ${ran?"pass":""}"><span class="ico">${ran?"✓":i+1}</span>
    <span><span class="lab">${s[0]}</span><span class="det">${ran?s[1]:"&nbsp;"}</span></span></div>`).join("");
  if(!ran) return `<div class="appwin"><div class="bar"><span class="dots"><i></i><i></i><i></i></span> Automated calc</div>
    <div class="body"><div class="checks">${checks}</div>
    <div style="margin-top:12px"><button class="btn primary" data-act="rpt-run">▶ Run</button></div></div></div>`;
  const rows=b.lines.map((l,i)=>{ const mg=lineMargin(l);
    const inp=`<input class="mono" style="width:104px;padding:5px 6px;border:1px solid var(--border-strong);border-radius:5px;background:var(--surface);color:var(--ink);text-align:right" placeholder="${l.flag?"manual $":""}" data-linebid="${b.id}" data-line="${i}" value="${hasManual(l)?l.manualPrice:(l.flag?"":l.newPrice.toFixed(2))}">`;
    return `<tr class="${l.flag?"lineflag":""}">
      <td class="mono">${l.pn}<div class="tiny">${l.family}</div></td>
      <td class="mono">${l.refBid}</td><td class="num">${money(l.base)}</td>
      <td class="mono">${l.memory}<div class="tiny">${l.ssd}</div></td>
      <td class="mono">${l.cpu}${l.flag?` <span class="pill bad">RTX · manual</span>`:""}</td>
      <td class="num">${inp}</td>
      <td class="num" id="lm-${b.id}-${i}">${mg==null?`<span class="pill warn">enter $</span>`:mg.toFixed(1)+"%"}</td></tr>`;
  }).join("");
  const bm=bidMargin(b);
  return `<div class="appwin"><div class="bar"><span class="dots"><i></i><i></i><i></i></span> Line-by-line result <span class="plat">edit any price</span></div>
    <div class="body">
      <div class="checks">${checks}</div>
      <div style="overflow-x:auto;margin-top:12px"><table class="sheet">
        <thead><tr><th>PN / model</th><th>Ref bid</th><th class="num">Orig.</th><th>Memory / SSD</th><th>CPU</th><th class="num">New price</th><th class="num">Margin</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr class="total"><td colspan="6">Blended margin</td><td class="num" id="bm-${b.id}">${bm==null?`<span class="pill warn">enter manual line</span>`:bm.toFixed(1)+"%"}</td></tr></tfoot>
      </table></div>
      <div class="field" style="margin-top:12px"><label>Extra notes (added to the pricing note)</label>
        <textarea data-input="pricerNote" data-id="${b.id}" placeholder="anything else the record needs…">${esc(b.pricerNote)}</textarea></div>
    </div></div>`;
}
function rptPM(b,a){
  const e=a.exception; const ran=S.rpt.ran;
  if(!ran) return `<div class="appwin"><div class="bar"><span class="dots"><i></i><i></i><i></i></span> Exception case</div>
    <div class="body"><div class="callout info">Run to pull the account context, then compile the case.</div>
    <div style="margin-top:12px"><button class="btn primary" data-act="rpt-run">▶ Run</button></div></div></div>`;
  return `<div class="appwin"><div class="bar"><span class="dots"><i></i><i></i><i></i></span> Exception case builder</div>
    <div class="body stack">
      <div class="grid3">
        <div class="field"><label>Account</label><div class="ro">${a.name} · ${a.geo}</div></div>
        <div class="field"><label>Vertical / GAM</label><div class="ro">${a.vertical} · ${a.gam}</div></div>
        <div class="field"><label>Requested</label><div class="ro">${esc(e.ask||"—")}</div></div>
      </div>
      <div class="field"><label>Sale's reason</label><div class="callout">${esc(e.reason||"—")}</div></div>
      <div class="field"><label>Account past performance (for the CFO)</label>
        <textarea data-input="perf" data-id="${a.id}" placeholder="Guidance history, renewal risk, competitive context, volume…">${esc(e.performance)}</textarea></div>
      <div class="field"><label>Materials</label>
        <div class="matlist">${(e.materials.length?e.materials:["(none attached)"]).map(m=>`<div class="m">📎 ${esc(m)}</div>`).join("")}</div>
        <div style="margin-top:8px"><button class="btn ghost sm" data-act="pm-attach" data-id="${a.id}">+ Attach TMCGP bridge</button></div></div>
    </div></div>`;
}
function rptDirector(b,a){
  const e=a.exception; const ran=S.rpt.ran;
  if(!ran) return `<div class="appwin"><div class="bar"><span class="dots"><i></i><i></i><i></i></span> Exception review</div>
    <div class="body"><div class="callout info">Run to load the PM's case and the KPI impact calculator.</div>
    <div style="margin-top:12px"><button class="btn primary" data-act="rpt-run">▶ Run</button></div></div></div>`;
  const base=BASELINE.find(x=>x.geo===a.geo&&x.vertical===a.vertical)||BASELINE.find(x=>x.geo===a.geo)||BASELINE[0];
  const C=S.calc;
  const rows=C.rows.map((r,i)=>`<tr><td class="tiny" style="text-align:center">${i+1}</td>
    <td><input data-crow="u" data-i="${i}" value="${r.u}"></td>
    <td><input data-crow="rev" data-i="${i}" value="${r.rev}"></td>
    <td><input data-crow="t" data-i="${i}" value="${r.t}"></td>
    <td><button class="del" data-act="calc-del" data-i="${i}">✕</button></td></tr>`).join("");
  let summary=`<div class="callout">Enter the new-deal lines and press Calculate.</div>`;
  if(C.out&&C.acctId===a.id){ const k=C.out;
    summary=`<table class="kpi-table">
      <tr><th></th><th>Base</th><th>New deal</th><th>Total</th><th>Δ</th><th>B(W) vs MT</th></tr>
      <tr><td class="metric">REV</td><td>${m2(k.baseRev)}</td><td>${m2(k.newRev)}</td><td>${m2(k.totRev)}</td><td>${m2(k.newRev)}</td><td>–</td></tr>
      <tr><td class="metric">TMCGP</td><td>${m2(k.baseTmcgp)}</td><td>${m2(k.newTmcgp)}</td><td>${m2(k.totTmcgp)}</td><td>${m2(k.newTmcgp)}</td><td>–</td></tr>
      <tr><td class="metric">TMCGP%</td><td>${k.basePct.toFixed(2)}%</td><td>${k.newPct.toFixed(2)}%</td><td>${k.totPct.toFixed(2)}%</td><td>${pp(k.totPct-k.basePct)}</td><td>${pp(k.bwPct)}</td></tr>
    </table><div class="tiny" style="margin-top:6px">B(W) vs MT = total − target (MT ${MT_TARGET.toFixed(1)}%) · pp = percentage points</div>`;
  }
  return `<div class="appwin"><div class="bar"><span class="dots"><i></i><i></i><i></i></span> Exception review + KPI impact</div>
    <div class="body stack">
      <div class="grid3">
        <div class="field"><label>Account</label><div class="ro">${a.name} · ${a.geo}</div></div>
        <div class="field"><label>Requested</label><div class="ro">${esc(e.ask||"—")}</div></div>
        <div class="field"><label>Submitted by</label><div class="ro">${e.submittedBy||"—"} ${e.submittedAt||""}</div></div>
      </div>
      <div class="field"><label>PM — account past performance</label><div class="callout">${esc(e.performance||"—")}</div></div>
      <div class="field"><label>Materials</label><div class="matlist">${(e.materials||[]).map(m=>`<div class="m">📎 ${esc(m)}</div>`).join("")||`<div class="tiny">none</div>`}</div></div>
      <div class="card" style="box-shadow:none"><h3>KPI calculator <span class="plat">baseline: ${base.geo} · ${base.vertical}</span></h3>
        <div class="pad">
          <div class="callout info" style="margin-bottom:10px">Baseline data source · ${base.geo}/${base.vertical}: REV ${m2(base.rev)} · TMCGP ${m2(base.tmcgp)} (${(base.tmcgp/base.rev*100).toFixed(2)}%)</div>
          <table class="kpi-rows"><tr><th>#</th><th>Units</th><th>REV (USD)</th><th>TMCGP%</th><th></th></tr>${rows}</table>
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn ghost sm" data-act="calc-add">+ Row</button>
            <button class="btn primary sm" data-act="calc-run" data-id="${a.id}">Calculate</button></div>
          <div style="margin-top:12px">${summary}</div>
        </div></div>
    </div></div>`;
}

/* ============================================================ Tracker */
function vwTrkSale(){
  const book=S.saleBook;
  const list=S.accounts.filter(a=>a.mgr===book);
  const stageLabel=a=>{ if(a.track!=="Exception")return "—"; const st=a.exception?.stage;
    return st==="PM-intake"?"PM compiling":st==="Director-review"?"At Director/CFO":st==="Approved"?"Approved":st==="Rejected"?"Rejected":"—"; };
  return `
  <p class="lede"><b>Layer 2 — Tracker (PowerApps, separate app).</b> The <b>Sync to Tracker</b> window in LBP writes here. This dashboard shows every account in a manager's book: lane, who last updated it, when, and how far an exception has progressed.</p>
  <div class="statgrid" style="margin-bottom:16px">
    <div class="stat"><div class="v">${list.length}</div><div class="l">Accounts in book</div><div class="s">${book}</div></div>
    <div class="stat"><div class="v">${list.filter(a=>a.track==="RPG").length}</div><div class="l">On RPG</div></div>
    <div class="stat"><div class="v">${list.filter(a=>a.track==="Exception").length}</div><div class="l">In exception</div></div>
    <div class="stat"><div class="v">${list.filter(a=>a.unread.sale).length}</div><div class="l">Unread results</div></div>
  </div>
  <div class="card">
    <h3>Sale dashboard — account book <span class="plat">Main Table</span></h3>
    <div class="pad">
      <div class="field" style="max-width:220px;margin-bottom:12px"><label>Sale Manager</label>
        <select data-input="saleBook">${SALE_MGRS.map(m=>`<option ${m===book?"selected":""}>${m}</option>`).join("")}</select></div>
      <table class="sheet">
        <thead><tr><th>Account</th><th>Lane</th><th>Guidance</th><th>Last updated by</th><th>When</th><th>Exception progress</th></tr></thead>
        <tbody>${list.map(a=>`<tr class="click" data-act="trk-sale-open" data-id="${a.id}">
          <td><b>${a.name}</b><div class="tiny">${a.geo} · ${a.vertical}</div>${a.unread.sale?` <span class="pill bad">● unread</span>`:""}</td>
          <td>${a.track==="RPG"?`<span class="pill info">RPG</span>`:a.track==="Exception"?`<span class="pill yellow">Exception</span>`:`<span class="pill mut">—</span>`}</td>
          <td class="mono">${a.guidance||"—"}</td>
          <td class="mono">${a.lastBy||"—"}</td><td class="mono">${a.lastAt||"—"}</td>
          <td>${stageLabel(a)}</td></tr>`).join("")}</tbody>
      </table>
    </div>
  </div>
  ${S.sel.saleAcct&&A(S.sel.saleAcct)&&A(S.sel.saleAcct).exception&&A(S.sel.saleAcct).exception.decision? `
    <div class="card" style="margin-top:16px"><h3>Exception result — ${A(S.sel.saleAcct).name}</h3>
      <div class="pad"><div class="callout ${A(S.sel.saleAcct).exception.decision==="Approved"?"good":"bad"}"><b>${A(S.sel.saleAcct).exception.decision}.</b> ${esc(A(S.sel.saleAcct).exception.decisionNote)}</div></div></div>`:""}`;
}
function boardLegend(){
  return `<div class="legend">
    <span><i style="background:var(--yellow)"></i> exception — needs action</span>

/* ============================================================ Reporting */
function vwReport(kind){
  const F=S.reportFilter;
  const all=S.accounts;
  const R=computeReport(all);
  const geos=["All",...new Set(all.map(a=>a.geo))];
  const verts=["All",...new Set(all.map(a=>a.vertical))];
  const match=a=>(F.geo==="All"||a.geo===F.geo)&&(F.vertical==="All"||a.vertical===F.vertical);
  const exc=R.exceptions.filter(match);
  const miss=R.missing.filter(match);

  const uplTable=`<table class="sheet">
    <thead><tr><th>Bucket</th><th class="num">Accounts</th><th class="num">% of active</th></tr></thead>
    <tbody>
      ${upRow("Full uplift",R.b.full,R.active)}${upRow("Partial uplift",R.b.partial,R.active)}
      ${upRow("No uplift",R.b.none,R.active)}${upRow("Missing input",R.b.missing,R.active)}
    </tbody>
    <tfoot><tr class="total"><td>Active total</td><td class="num">${R.active}</td><td class="num">100%</td></tr></tfoot></table>`;

  const chart=kind==="GA"?decompTree(R):verticalBreakdown();

  return `
  <p class="lede"><b>Layer 3 — Reporting (Power BI, live from the Tracker's Main Table).</b> ${kind==="GA"?"The <b>GA</b> page decomposes the whole book by status.":"The <b>GTP</b> page breaks the same book down by vertical."} The exception &amp; missing-input tables below have their own Geo / Vertical filter.</p>

  <div class="statgrid" style="margin-bottom:16px">
    <div class="stat"><div class="v">${R.total}</div><div class="l">GA accounts</div></div>
    <div class="stat"><div class="v">${R.active}</div><div class="l">Active</div><div class="s">${pct(R.active,R.total)}</div></div>
    <div class="stat"><div class="v">${R.notActive}</div><div class="l">Not active</div></div>
    <div class="stat"><div class="v">${R.b.missing}</div><div class="l">Missing input</div><div class="s">${pct(R.b.missing,R.active)} of active</div></div>
    <div class="stat"><div class="v">${R.exceptions.length}</div><div class="l">Exceptions</div></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <h3>${kind==="GA"?"GA account decomposition":"GTP — accounts by vertical"} <span class="plat">Power BI</span></h3>
    <div class="pad cols2" style="align-items:start">
      <div style="overflow-x:auto">${chart}</div>
      <div>${uplTable}</div>
    </div>
  </div>

  <div class="card">
    <h3>Exception &amp; missing-input detail</h3>
    <div class="pad">
      <div class="filterbar">
        <div class="field"><label>Geo</label><select data-input="fGeo">${geos.map(g=>`<option ${g===F.geo?"selected":""}>${g}</option>`).join("")}</select></div>
        <div class="field"><label>Vertical</label><select data-input="fVert">${verts.map(v=>`<option ${v===F.vertical?"selected":""}>${v}</option>`).join("")}</select></div>
        ${(F.geo!=="All"||F.vertical!=="All")?`<button class="btn ghost sm" data-act="rep-clear">Clear</button>`:""}
      </div>
      <div class="cols2">
        <div>
          <div class="tiny" style="margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em">Exception accounts · ${exc.length}</div>
          <table class="sheet"><thead><tr><th>Account</th><th>Geo / Vert</th><th>Stage</th><th>Decision</th></tr></thead>
            <tbody>${exc.map(a=>`<tr><td><b>${a.name}</b></td><td class="mono">${a.geo}/${a.vertical}</td><td>${a.exception?.stage||"—"}</td>
              <td>${a.exception?.decision?decisionPill(a.exception.decision):`<span class="pill yellow">pending</span>`}</td></tr>`).join("")||`<tr><td colspan="4" class="tiny">none</td></tr>`}</tbody></table>
        </div>
        <div>
          <div class="tiny" style="margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em">Missing input · ${miss.length}</div>
          <table class="sheet"><thead><tr><th>Account</th><th>Geo / Vert</th><th>Sale Mgr</th><th>Last updated</th></tr></thead>
            <tbody>${miss.map(a=>`<tr><td><b>${a.name}</b></td><td class="mono">${a.geo}/${a.vertical}</td><td>${a.mgr}</td><td class="mono">${a.lastAt||"never"}</td></tr>`).join("")||`<tr><td colspan="4" class="tiny">none</td></tr>`}</tbody></table>
        </div>
      </div>
    </div>
  </div>`;
}
function upRow(label,n,base){
  const c={"Full uplift":"var(--good)","Partial uplift":"var(--warn)","No uplift":"var(--bad)","Missing input":"var(--border-strong)"}[label];
  return `<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${c};margin-right:7px"></span>${label}</td><td class="num">${n}</td><td class="num">${pct(n,base)}</td></tr>`;
}
function decompTree(R){
  const bar=(v,max,color)=>`<div class="tn-bar"><i style="width:${max?Math.round(v/max*100):0}%;background:${color}"></i></div>`;
  const maxTop=Math.max(R.active,R.notActive,1), maxB=Math.max(R.b.full,R.b.partial,R.b.none,R.b.missing,1);
  return `<div class="tree">
    <div class="tcol"><div class="tnode root"><div class="tn-l">GA portfolio</div><div class="tn-v">${R.total}</div></div></div>
    <div class="tcol links"><div class="lwrap"><span class="link"></span><span class="link"></span></div></div>
    <div class="tcol">
      <div class="tnode"><div class="tn-l">Active</div><div class="tn-v">${R.active}</div>${bar(R.active,maxTop,"var(--good)")}</div>
      <div class="tnode"><div class="tn-l">Not active</div><div class="tn-v">${R.notActive}</div>${bar(R.notActive,maxTop,"var(--muted)")}</div>
    </div>
    <div class="tcol links"><div class="lwrap"><span class="link"></span></div></div>
    <div class="tcol">
      <div class="tnode"><div class="tn-l">Full uplift</div><div class="tn-v">${R.b.full}</div>${bar(R.b.full,maxB,"var(--good)")}</div>
      <div class="tnode"><div class="tn-l">Partial uplift</div><div class="tn-v">${R.b.partial}</div>${bar(R.b.partial,maxB,"var(--warn)")}</div>
      <div class="tnode"><div class="tn-l">No uplift</div><div class="tn-v">${R.b.none}</div>${bar(R.b.none,maxB,"var(--bad)")}</div>
      <div class="tnode"><div class="tn-l">Missing input</div><div class="tn-v">${R.b.missing}</div>${bar(R.b.missing,maxB,"var(--border-strong)")}</div>
    </div>
  </div>`;
}
function verticalBreakdown(){
  const verts=[...new Set(S.accounts.map(a=>a.vertical))];
  return `<div class="treemap">`+verts.map(v=>{
    const sub=S.accounts.filter(a=>a.vertical===v); const R=computeReport(sub);
    const seg=(n,color)=>n?`<i style="width:${n/Math.max(R.active,1)*100}%;background:${color}"></i>`:"";
    return `<div class="tm"><h4>${v} <span>${sub.length} acct · ${R.active} active</span></h4>
      <div class="stack">${seg(R.b.full,"var(--good)")}${seg(R.b.partial,"var(--warn)")}${seg(R.b.none,"var(--bad)")}${seg(R.b.missing,"var(--border-strong)")}</div>
      <div class="key"><span><b style="background:var(--good)"></b>Full ${R.b.full}</span><span><b style="background:var(--warn)"></b>Partial ${R.b.partial}</span>
        <span><b style="background:var(--bad)"></b>None ${R.b.none}</span><span><b style="background:var(--border-strong)"></b>Missing ${R.b.missing}</span></div></div>`;
  }).join("")+`</div>`;
}

/* ============================================================ bind */
function bind(){
  $$("[data-input]").forEach(node=>{
    const key=node.dataset.input;
    node.onchange=()=>inputChange(key,node.value,node);
    if(node.tagName==="TEXTAREA"||node.type==="text"||node.tagName==="INPUT") node.oninput=()=>inputChange(key,node.value,node,true);
  });
  $$("[data-linebid]").forEach(inp=>{
    inp.oninput=()=>{ const b=B(inp.dataset.linebid); if(!b)return;
      const i=+inp.dataset.line, l=b.lines[i];
      l.manualPrice=inp.value.replace(/[^0-9.]/g,"");
      const mc=document.getElementById("lm-"+b.id+"-"+i);
      if(mc){ const mg=lineMargin(l); mc.innerHTML=mg==null?'<span class="pill warn">enter $</span>':mg.toFixed(1)+"%"; }
      const f=document.getElementById("bm-"+b.id);
      if(f){ const bm=bidMargin(b); f.innerHTML=bm==null?'<span class="pill warn">enter manual line</span>':bm.toFixed(1)+"%"; }
      const nb=document.getElementById("rpt-note"); if(nb) nb.textContent=pricingNote(b);
    };
  });
  $$("[data-crow]").forEach(inp=>{ inp.oninput=()=>{ S.calc.rows[+inp.dataset.i][inp.dataset.crow]=inp.value.replace(/[^0-9.]/g,""); }; });
  $$("[data-act]").forEach(n=>{ n.onclick=e=>{ (ACT[n.dataset.act]||(()=>{}))(n.dataset,e,n); }; });
  $$("[data-tab]").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; S.rpt.open=null; render(); });
  $$("[data-role]").forEach(b=>{ if(b.dataset.act)return; b.onclick=()=>{ S.role[S.tab]=b.dataset.role; S.rpt.open=null; render(); }; });
}
function inputChange(key,val,node,silent){
  switch(key){
    case "saleBook": S.saleBook=val; S.sel.saleAcct=null; render(); break;
    case "saleAcct": S.sel.saleAcct=val; break;
    case "brType": S._brType=val; break;
    case "brFul": S._brFul=val; break;
    case "brDesc": S._brDesc=val; break;
    case "excReason": S._excReason=val; break;
    case "excAsk": S._excAsk=val; break;
    case "q_active": S._qActive=val; break;
    case "q_guidance": S._qGuid=val; break;
    case "q_eff": S._qEff=val; break;
    case "q_lnl": S._qLnl=val; break;
    case "pricerNote": { const b=B(node.dataset.id); if(b){ b.pricerNote=val; const nb=document.getElementById("rpt-note"); if(nb)nb.textContent=pricingNote(b);} break; }
    case "perf": { const a=A(node.dataset.id); if(a&&a.exception){ a.exception.performance=val; const nb=document.getElementById("rpt-note"); if(nb)nb.textContent=excCaseNote(a);} break; }
    case "rejReason": { const b=B(node.dataset.id); if(b)b.rejectReason=val; break; }
    case "dirNote": S._dirNote=val; break;
    case "recSearch": S.sel.recSearch=val; if(!silent) render(); break;
    case "fGeo": S.reportFilter.geo=val; render(); break;
    case "fVert": S.reportFilter.vertical=val; render(); break;
  }
}

/* ============================================================ actions */
const ACT={
  "open-log"(){ S.overlay="log"; renderOverlay(); bind(); },
  "close-overlay"(){ S.overlay=null; render(); },
  "reset-all"(){ S=freshState(); render(); toast("Demo reset."); },

  /* --- LBP · Sale --- */
  "lbp-submit"(){
    const a=A(S.sel.saleAcct)||S.accounts.find(x=>x.mgr===S.saleBook);
    const desc=(S._brDesc||"").trim()||"RPG renewal";
    const isExc=/exception/i.test(desc);
    const b=mkBid({id:nextBid(),accountId:a.id,type:isExc?"Exception":"RPG",description:desc,submittedBy:a.sp.split("@")[0],
      lbpStatus:isExc?"with-pm":"with-pricer",lineIdx:[0,1,2]});
    S.bids.unshift(b); S._brDesc="";
    if(isExc){
      a.track="Exception";
      a.exception={stage:"PM-intake", reason:"", ask:"", performance:"", materials:[],
        submittedBy:null, submittedAt:null, decision:null, decisionNote:"", calc:null};
      a.lastBy=a.sp.split("@")[0]; a.lastAt=todayStamp();
      log(`Sale submitted <b>${a.name}</b> in LBP — Description tagged <b>Exception</b> (${b.id}).`, true);
      S.overlay="sync-exc:"+b.id; renderOverlay(); bind();
    } else {
      log(`Sale submitted <b>${a.name}</b> in LBP — <b>RPG</b> (${b.id}) → Pricer work list.`, true);
      toast(`${a.name} · RPG → Pricer.`); render();
    }
  },
  "sync-exc-submit"(d){
    const b=B(d.id), a=bidAcct(b);
    a.track="Exception";
    a.exception={stage:"PM-intake", reason:S._excReason||"", ask:S._excAsk||"",
      performance:"", materials:[], submittedBy:null, submittedAt:null, decision:null, decisionNote:"", calc:null};
    a.lastBy=a.sp.split("@")[0]; a.lastAt=todayStamp();
    S._excReason=""; S._excAsk=""; S.overlay=null;
    log(`Sync to Tracker — <b>${a.name}</b> written as an exception. Profit Manager ${PM_OF[a.mgr]} picks it up in LBP.`, true);
    toast(`${a.name} synced to Tracker as Exception.`);
    render();
  },
  "sale-confirm-open"(d){
    const b=B(d.id);
    if(b.type==="Exception"){ S.overlay="sync-exc:"+b.id; }
    else { S.overlay="sync-rpg:"+b.id; }
    renderOverlay(); bind();
  },
  "sync-rpg-submit"(d){
    const b=B(d.id), a=bidAcct(b);
    a.track="RPG"; a.active=(S._qActive||"Yes")==="Yes"; a.guidance=S._qGuid||"Full";
    a.effective=S._qEff||"2026-02-01"; a.lnl=(S._qLnl||"No")==="Yes";
    a.lastBy=a.sp.split("@")[0]; a.lastAt=todayStamp();
    b.lbpStatus="closed"; S.overlay=null;
    log(`Sync to Tracker — <b>${a.name}</b> RPG confirmed: ${a.guidance} guidance · effective ${a.effective} · LNL ${a.lnl?"yes":"no"}.`, true);
    toast(`${a.name} synced to Tracker (RPG).`);
    render();
  },
  "sale-open-result"(d){
    const b=B(d.id), a=bidAcct(b);
    if(a.unread.sale){ a.unread.sale=false; log(`Sale read the decision on <b>${a.name}</b>.`); }
    S.sel.saleAcct=a.id; S.tab="tracker"; S.role.tracker="sale";
    render();
  },

  /* --- RPT --- */
  "rpt-open"(d){
    if(!canRPT(d.role)){ toast("RPT is Pricer / PM / Director only."); return; }
    S.rpt={open:d.id, role:d.role, ran:!!rptRecord(d.id,d.role)};
    if(d.role==="director"){ const a=bidAcct(B(d.id)); S.calc={rows:[{u:120,rev:163680,t:8.5}],out:null,acctId:a.id}; }
    render();
  },
  "rpt-close"(){ S.rpt={open:null,role:null,ran:false}; render(); },
  "rpt-run"(){ S.rpt.ran=true;
    const b=B(S.rpt.open);
    log(`RPT run · ${S.rpt.role} · <b>${bidAcct(b).name}</b> (${b.id}).`);
    render(); },
  "rpt-lps"(d){ const b=B(d.id); b.lpsSynced=true;
    log(`RPT → Sync to LPS · <b>${bidAcct(b).name}</b> (${b.id}) — pending integration / write permissions.`);
    toast("Queued to LPS."); render(); },
  "rpt-copy"(d){
    const b=B(d.id), a=bidAcct(b), role=S.rpt.role;
    const text=role==="pricer"?pricingNote(b):role==="pm"?excCaseNote(a):kpiNote(a);
    copyText(text); toast("Pricing note copied to clipboard.");
  },
  "rpt-save"(d){
    const b=B(d.id), a=bidAcct(b), role=S.rpt.role;
    const kind=role==="pricer"?"pricing":role==="pm"?"exception-case":"kpi-impact";
    const note=role==="pricer"?pricingNote(b):role==="pm"?excCaseNote(a):kpiNote(a);
    const savedBy=role==="pricer"?PRICER:role==="pm"?PM_OF[a.mgr]:DIRECTOR;
    let rec=rptRecord(d.id,role);
    if(rec){ rec.note=note; rec.ts=todayStamp(); toast("Record updated."); }
    else { rec={id:nextRpt(),bidId:d.id,account:a.name,kind,role,savedBy,ts:todayStamp(),note};
      S.rptRecords.unshift(rec); toast(`Saved as ${rec.id}.`); }
    if(role==="director"&&S.calc.out&&S.calc.acctId===a.id) a.exception.calc={totPct:S.calc.out.totPct,bwPct:S.calc.out.bwPct};
    log(`RPT record ${rec.id} saved · ${role} · <b>${a.name}</b>. LBP decision unlocked.`, true);
    render();
  },
  "pm-attach"(d){ const a=A(d.id);
    if(a&&a.exception&&!a.exception.materials.includes("tmcgp_bridge_fy26.xlsx")) a.exception.materials.push("tmcgp_bridge_fy26.xlsx");
    const nb=document.getElementById("rpt-note"); if(nb)nb.textContent=excCaseNote(a);
    render(); },
  "calc-add"(){ S.calc.rows.push({u:0,rev:0,t:0}); render(); },
  "calc-del"(d){ S.calc.rows.splice(+d.i,1); if(!S.calc.rows.length)S.calc.rows.push({u:0,rev:0,t:0}); render(); },
  "calc-run"(d){ const out=runCalc(d.id);
    log(`RPT KPI calc · <b>${A(d.id).name}</b> — TMCGP% ${out.totPct.toFixed(2)}%, ${pp(out.bwPct)} vs MT.`);
    render(); },

  /* --- LBP decisions --- */
  "lbp-approve"(d){
    const b=B(d.id), a=bidAcct(b);
    if(b.type==="RPG"){
      b.lbpStatus="sale-confirm"; b.decision="Approved"; b.decisionBy=PRICER;
      log(`Pricer <b>approved</b> ${b.id} (${a.name}) in LBP — blended ${bidMargin(b)!=null?bidMargin(b)+"%":"—"}. → Sale to confirm.`, true);
      toast(`${a.name} approved — Sale to confirm.`);
      render();
    } else {
      S._dirNote="Approved. "+(a.exception.ask||"the request")+" is acceptable given account history; TMCGP% impact within MT tolerance.";
      S.overlay="approve:"+d.id; renderOverlay(); bind();
    }
  },
  "lbp-approve-confirm"(d){
    const b=B(d.id), a=bidAcct(b);
    b.lbpStatus="closed"; b.decision="Approved"; b.decisionBy=DIRECTOR;
    a.exception.stage="Approved"; a.exception.decision="Approved";
    a.exception.decisionNote=S._dirNote||"Approved as requested for the tranche in scope.";
    a.unread.sale=true; a.unread.pm=true;
    if(!a.guidance) a.guidance="Partial";
    S.overlay=null; S._dirNote="";
    log(`Director/CFO <b>approved</b> the ${a.name} exception (${b.id}) in LBP. Synced to Tracker; PM + Sale notified.`, true);
    toast(`${a.name} exception approved.`);
    render();
  },
  "lbp-reject-open"(d){
    const b=B(d.id);
    if(!b.rejectReason) b.rejectReason = b.type==="Exception"
      ? "Impact exceeds the MT threshold; renegotiate volume commitment instead."
      : "Can't hold the guided price on this configuration — revise the PN mix or volume and resubmit.";
    S.overlay="reject:"+d.id; renderOverlay(); bind();
  },
  "lbp-reject-confirm"(d){
    const b=B(d.id), a=bidAcct(b);
    b.decision="Rejected"; b.lbpStatus="closed";
    if(b.type==="RPG"){ b.decisionBy=PRICER;
      log(`Pricer <b>rejected</b> ${b.id} (${a.name}) — ${esc(b.rejectReason)}. Back to Sale.`, true); }
    else { b.decisionBy=DIRECTOR;
      a.exception.stage="Rejected"; a.exception.decision="Rejected"; a.exception.decisionNote=b.rejectReason;
      a.unread.sale=true; a.unread.pm=true;
      log(`Director/CFO <b>rejected</b> the ${a.name} exception (${b.id}) — ${esc(b.rejectReason)}. Synced to Tracker.`, true); }
    S.overlay=null; toast(`${a.name} rejected.`); render();
  },
  "lbp-pm-submit"(d){
    const b=B(d.id), a=bidAcct(b), e=a.exception;
    e.stage="Director-review"; e.submittedBy=PM_OF[a.mgr]; e.submittedAt=todayStamp();
    if(!e.materials.length) e.materials.push("tmcgp_bridge_fy26.xlsx");
    b.lbpStatus="with-director";
    log(`Profit Manager ${e.submittedBy} submitted the <b>${a.name}</b> exception to Director/CFO (${b.id}).`, true);
    toast(`${a.name} → Director/CFO.`);
    render();
  },

  /* --- RPT records --- */
  "rec-view"(d){ S.overlay="rec:"+d.id; renderOverlay(); bind(); },
  "rec-copy"(d){ const r=S.rptRecords.find(x=>x.id===d.id); if(r){ copyText(r.note); toast("Note copied."); } },

  /* --- Tracker --- */
  "trk-sale-open"(d){ const a=A(d.id); if(a.unread.sale){ a.unread.sale=false; log(`Sale read the result on <b>${a.name}</b>.`); } S.sel.saleAcct=d.id; render(); },
  "trk-board"(d){ if(d.role==="pm"){ S.sel.trkPM=d.id; } else { S.sel.trkDir=d.id; } render(); },
  "trk-mark-read"(d){ const a=A(d.id); a.unread.pm=false; log(`PM read the decision on <b>${a.name}</b>.`); render(); },

  /* --- reporting --- */
  "rep-clear"(){ S.reportFilter={geo:"All",vertical:"All"}; render(); }
};

render();
</script>
</body>
</html>
