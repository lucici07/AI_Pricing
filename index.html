<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font:14px/1.5 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#F3F5F9}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>GA Repricing Platform</title>
<meta name="description" content="Clickable prototype: the RPT repricing tool embedded per-bid in LBP, a separate PowerApps Tracker, and Power BI reporting over shared bid and account state.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#F3F5F9; --surface:#FFFFFF; --surface-2:#EDF0F6;
    --border:#D9DFEA; --border-strong:#C1C9D9;
    --ink:#15233F; --ink-2:#45516A; --muted:#6C7689;
    --navy:#1C2C4E; --brand:#D51E28; --brand-ink:#A9151D;
    --info:#2E5AAC; --info-bg:#E7EEFA;
    --good:#1C7C4A; --good-bg:#E2F1E8;
    --warn:#A96A08; --warn-bg:#FAF0DE;
    --bad:#BF3B30; --bad-bg:#FBE8E5;
    --yellow:#C9971B; --yellow-bg:#FBF2DA;
    --shadow:0 1px 2px rgba(21,35,63,.05), 0 8px 24px -16px rgba(21,35,63,.18);
    --fs-display:"Newsreader",Georgia,"Times New Roman",serif;
    --fs-sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --fs-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0D1524; --surface:#141F35; --surface-2:#1D2B47;
      --border:#2B3B58; --border-strong:#3C4F72;
      --ink:#ECF0F8; --ink-2:#BAC4D7; --muted:#8A95AC;
      --navy:#25375D; --brand:#F0474F; --brand-ink:#F0474F;
      --info:#77A4EE; --info-bg:#182A47;
      --good:#48B57E; --good-bg:#12301F;
      --warn:#E0A445; --warn-bg:#33270F;
      --bad:#E9695C; --bad-bg:#331A16;
      --yellow:#E3B84D; --yellow-bg:#332912;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0D1524; --surface:#141F35; --surface-2:#1D2B47;
    --border:#2B3B58; --border-strong:#3C4F72;
    --ink:#ECF0F8; --ink-2:#BAC4D7; --muted:#8A95AC;
    --navy:#25375D; --brand:#F0474F; --brand-ink:#F0474F;
    --info:#77A4EE; --info-bg:#182A47;
    --good:#48B57E; --good-bg:#12301F;
    --warn:#E0A445; --warn-bg:#33270F;
    --bad:#E9695C; --bad-bg:#331A16;
    --yellow:#E3B84D; --yellow-bg:#332912;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--fs-sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{margin:0;text-wrap:balance;}
  button,input,select,textarea{font-family:inherit;}
  a{color:var(--info);}

  .topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);}
  .topbar .rule{height:3px;background:var(--brand);}
  .topbar .inner{max-width:1440px;margin:0 auto;padding:11px 22px 0;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .wordmark{display:flex;align-items:baseline;gap:9px;}
  .wordmark b{font-family:var(--fs-display);font-weight:600;font-size:20px;}
  .wordmark span{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:600;}
  .top-actions{margin-left:auto;display:flex;gap:9px;align-items:center;}
  .btn-plain{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);border-radius:7px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;}
  .btn-plain:hover{border-color:var(--brand);color:var(--brand);}
  .tabs{max-width:1440px;margin:0 auto;padding:6px 22px 0;display:flex;gap:4px;}
  .tab{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:9px 15px;border-radius:8px 8px 0 0;cursor:pointer;border-bottom:2px solid transparent;}
  .tab:hover{color:var(--ink);}
  .tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);background:var(--surface-2);}
  .tab .n{font-family:var(--fs-mono);font-size:10px;background:var(--brand);color:#fff;border-radius:9px;padding:0 5px;margin-left:5px;}

  .shell{max-width:1440px;margin:0 auto;padding:18px 22px 60px;}
  .roles{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .roles .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-right:4px;}
  .role-seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;flex-wrap:wrap;}
  .role-seg button{border:0;border-right:1px solid var(--border);background:var(--surface);color:var(--ink-2);padding:7px 13px;font-size:12.5px;font-weight:500;cursor:pointer;}
  .role-seg button:last-child{border-right:0;}
  .role-seg button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:600;}
  :root[data-theme="dark"] .role-seg button[aria-pressed="true"]{color:#0D1524;background:var(--info);}

  .lede{color:var(--ink-2);font-size:13px;margin:-4px 0 16px;max-width:80ch;}
  .lede b{color:var(--ink);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;}
  .card > h3{padding:12px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
  .card > h3 .plat{margin-left:auto;font-family:var(--fs-mono);font-weight:400;letter-spacing:0;text-transform:none;font-size:10px;}
  .card .pad{padding:16px;}
  .appwin{border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;}
  .appwin > .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--navy);color:#fff;font-size:12px;font-weight:600;}
  .appwin > .bar .dots{display:flex;gap:5px;}
  .appwin > .bar .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);}
  .appwin > .bar .plat{margin-left:auto;font-family:var(--fs-mono);font-weight:400;font-size:11px;opacity:.85;}
  .appwin > .body{padding:16px;background:var(--surface);}

  .lbpbar{display:flex;align-items:center;gap:12px;background:var(--brand);color:#fff;padding:9px 16px;border-radius:10px 10px 0 0;}
  .lbpbar .lg{font-family:var(--fs-display);font-weight:600;font-size:15px;letter-spacing:.3px;}
  .lbpbar .sr{margin-left:auto;background:rgba(255,255,255,.16);border-radius:6px;padding:4px 10px;font-size:11px;font-family:var(--fs-mono);}
  .lbpwrap{border:1px solid var(--border-strong);border-top:0;border-radius:0 0 10px 10px;background:var(--surface);padding:16px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);color:var(--ink);font-size:13px;}
  .field textarea{resize:vertical;min-height:66px;line-height:1.45;}
  .field .ro{padding:8px 10px;border:1px dashed var(--border-strong);border-radius:7px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;font-family:var(--fs-mono);}
  :focus-visible{outline:2px solid var(--info);outline-offset:1px;}

  .btn{border:0;border-radius:8px;padding:9px 17px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
  .btn.primary{background:var(--brand);color:#fff;}
  .btn.primary:hover{background:var(--brand-ink);}
  .btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--border-strong);}
  .btn.ghost:hover{border-color:var(--info);color:var(--info);}
  .btn.ok{background:var(--good);color:#fff;}
  .btn.danger{background:var(--surface);color:var(--bad);border:1px solid var(--bad);}
  .btn.sm{padding:6px 11px;font-size:12px;}
  .btn:disabled{opacity:.42;cursor:not-allowed;}

  .callout{border-radius:9px;padding:11px 13px;font-size:12.5px;line-height:1.5;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);}
  .callout.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 30%,transparent);color:var(--ink);}
  .callout.good{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 30%,transparent);}
  .callout.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent);}
  .callout.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 35%,transparent);}
  .callout b{color:var(--ink);}
  .tiny{font-size:11px;color:var(--muted);}
  .mono{font-family:var(--fs-mono);}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
  .pill.good{background:var(--good-bg);color:var(--good);}
  .pill.warn{background:var(--warn-bg);color:var(--warn);}
  .pill.bad{background:var(--bad-bg);color:var(--bad);}
  .pill.info{background:var(--info-bg);color:var(--info);}
  .pill.yellow{background:var(--yellow-bg);color:var(--yellow);}
  .pill.mut{background:var(--surface-2);color:var(--muted);}

  table.sheet{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.sheet th,table.sheet td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;}
  table.sheet th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;}
  table.sheet td.num,table.sheet th.num{text-align:right;font-family:var(--fs-mono);font-variant-numeric:tabular-nums;}
  table.sheet tr:last-child td{border-bottom:0;}
  table.sheet .total td{font-weight:700;background:var(--surface-2);}
  table.sheet tbody tr.click{cursor:pointer;}
  table.sheet tbody tr.click:hover{background:var(--surface-2);}

  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
  .stat{border:1px solid var(--border);border-radius:10px;padding:13px 14px;background:var(--surface);}
  .stat .v{font-family:var(--fs-display);font-weight:600;font-size:25px;line-height:1;}
  .stat .l{font-size:11px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.04em;}
  .stat .s{font-size:11px;color:var(--ink-2);margin-top:2px;font-family:var(--fs-mono);}

  .wl{display:flex;flex-direction:column;gap:8px;}
  .wlrow{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;border:1px solid var(--border-strong);border-radius:10px;padding:11px 13px 11px 0;background:var(--surface);cursor:pointer;}
  .wlrow:hover{border-color:var(--info);}
  .wlrow .stripe{align-self:stretch;border-radius:10px 0 0 10px;background:var(--border-strong);}
  .wlrow.rpg .stripe{background:var(--info);}
  .wlrow.exc .stripe{background:var(--yellow);}
  .wlrow.done .stripe{background:var(--good);}
  .wlrow.rej .stripe{background:var(--bad);}
  .wlrow .m1{font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .wlrow .m2{font-size:11.5px;color:var(--muted);font-family:var(--fs-mono);margin-top:2px;}
  .wlrow .chev{color:var(--muted);font-size:16px;padding-right:12px;}

  .toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .bidsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .commentthread{display:flex;flex-direction:column;gap:8px;}
  .cmt{border:1px solid var(--border);border-radius:9px;padding:9px 11px;background:var(--surface-2);font-size:12.5px;}
  .cmt .h{font-size:10.5px;color:var(--muted);font-family:var(--fs-mono);margin-bottom:3px;display:flex;gap:8px;align-items:center;}
  .cmt.approve{border-left:3px solid var(--good);}
  .cmt.reject{border-left:3px solid var(--bad);}
  .cmt.reassign{border-left:3px solid var(--info);}
  .cmt.note{border-left:3px solid var(--border-strong);}

  .board{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start;}
  .blist{display:flex;flex-direction:column;gap:6px;max-height:640px;overflow-y:auto;padding-right:2px;}
  .brow{display:grid;grid-template-columns:6px 1fr auto;gap:10px;align-items:center;border:1px solid var(--border-strong);border-radius:9px;padding:10px 12px 10px 0;cursor:pointer;background:var(--surface);}
  .brow:hover{border-color:var(--info);}
  .brow.sel{border-color:var(--ink);box-shadow:0 0 0 2px color-mix(in srgb,var(--ink) 18%,transparent);}
  .brow .stripe{align-self:stretch;border-radius:9px 0 0 9px;}
  .brow.yellow .stripe{background:var(--yellow);}
  .brow.blue .stripe{background:var(--info);}
  .brow.green .stripe{background:var(--good);}
  .brow.red .stripe{background:var(--bad);}
  .brow.grey .stripe{background:var(--border-strong);}
  .brow .nm{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;}
  .brow .meta{font-size:11px;color:var(--muted);font-family:var(--fs-mono);}
  .brow .unread{width:8px;height:8px;border-radius:50%;background:var(--brand);flex-shrink:0;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:8px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .bdetail{border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;}
  .bdetail .dhead{padding:14px 18px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--surface),var(--surface-2));}
  .bdetail .dhead h3{font-family:var(--fs-display);font-weight:600;font-size:20px;}
  .bdetail .dhead .sub{font-size:12px;color:var(--muted);margin-top:2px;font-family:var(--fs-mono);}
  .bdetail .dbody{padding:18px;display:flex;flex-direction:column;gap:14px;}

  .matlist{display:flex;flex-direction:column;gap:6px;}
  .matlist .m{display:flex;align-items:center;gap:8px;font-size:12px;font-family:var(--fs-mono);border:1px solid var(--border);border-radius:7px;padding:7px 10px;background:var(--surface-2);}

  .checks{display:flex;flex-direction:column;}
  .check{display:grid;grid-template-columns:22px 1fr;gap:11px;align-items:start;padding:10px 4px;border-bottom:1px solid var(--border);}
  .check:last-child{border-bottom:0;}
  .check .ico{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);border:1.5px solid var(--border-strong);}
  .check.pass .ico{background:var(--good);border-color:var(--good);color:#fff;}
  .check .lab{font-weight:600;font-size:13px;}
  .check .det{font-size:11.5px;color:var(--muted);margin-top:2px;font-family:var(--fs-mono);line-height:1.4;}
  .lineflag{background:var(--warn-bg);}
  .notebox{white-space:pre-wrap;font-family:var(--fs-mono);font-size:11px;line-height:1.6;border:1px solid var(--border-strong);border-radius:8px;padding:11px;background:var(--surface-2);color:var(--ink);max-height:230px;overflow:auto;}

  .kpi-rows{width:100%;border-collapse:collapse;font-size:12px;}
  .kpi-rows th,.kpi-rows td{padding:6px;border-bottom:1px solid var(--border);}
  .kpi-rows th{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .kpi-rows input{width:100%;padding:5px 6px;border:1px solid var(--border-strong);border-radius:5px;background:var(--surface);color:var(--ink);font-family:var(--fs-mono);font-size:12px;text-align:right;}
  .kpi-rows .del{border:0;background:0;color:var(--muted);cursor:pointer;font-size:13px;}
  .kpi-table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .kpi-table th,.kpi-table td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--border);}
  .kpi-table th:first-child,.kpi-table td:first-child{text-align:left;}
  .kpi-table td{font-family:var(--fs-mono);font-variant-numeric:tabular-nums;}
  .kpi-table .metric{font-family:var(--fs-sans);font-weight:600;}

  .tree{display:flex;align-items:stretch;overflow-x:auto;padding:6px 0;}
  .tcol{display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:170px;}
  .tcol.links{min-width:30px;}
  .tnode{border:1px solid var(--border-strong);border-radius:9px;padding:10px 12px;background:var(--surface);}
  .tnode.root{background:var(--navy);color:#fff;border-color:var(--navy);}
  .tnode .tn-l{font-size:11px;text-transform:uppercase;letter-spacing:.04em;opacity:.85;}
  .tnode .tn-v{font-family:var(--fs-display);font-weight:600;font-size:21px;line-height:1.1;}
  .tnode .tn-bar{height:6px;border-radius:4px;background:var(--surface-2);margin-top:7px;overflow:hidden;}
  .tnode .tn-bar i{display:block;height:100%;border-radius:4px;}
  .lwrap{display:flex;flex-direction:column;justify-content:space-around;height:100%;}
  .lwrap .link{flex:1;border-bottom:1px solid var(--border-strong);}
  .treemap{display:flex;flex-wrap:wrap;gap:8px;}
  .tm{border:1px solid var(--border-strong);border-radius:9px;padding:11px;background:var(--surface);min-width:150px;flex:1;}
  .tm h4{font-size:13px;display:flex;justify-content:space-between;align-items:baseline;}
  .tm h4 span{font-family:var(--fs-mono);font-size:11px;color:var(--muted);}
  .tm .stack{display:flex;height:14px;border-radius:5px;overflow:hidden;margin:9px 0 7px;background:var(--surface-2);}
  .tm .stack i{height:100%;}
  .tm .key{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:10.5px;color:var(--muted);}
  .tm .key span{display:inline-flex;align-items:center;gap:4px;}
  .tm .key b{width:8px;height:8px;border-radius:2px;display:inline-block;}
  .filterbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;}
  .filterbar .field{min-width:140px;}

  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  .stack{display:flex;flex-direction:column;gap:16px;}

  .scrim{position:fixed;inset:0;background:rgba(10,16,30,.45);z-index:50;display:flex;justify-content:flex-end;}
  .drawer{width:min(400px,92vw);background:var(--surface);height:100%;box-shadow:-12px 0 40px -20px rgba(0,0,0,.5);display:flex;flex-direction:column;}
  .drawer .dh{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:700;}
  .drawer .dh .x{margin-left:auto;cursor:pointer;color:var(--muted);border:0;background:0;font-size:16px;}
  .drawer .dc{overflow-y:auto;padding:8px 0;flex:1;}
  .li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 16px;font-size:12px;line-height:1.4;}
  .li time{font-family:var(--fs-mono);font-size:10px;color:var(--muted);padding-top:2px;}
  .li b{color:var(--ink);}
  .li.acc{border-left:2px solid var(--brand);}

  .modal-scrim{position:fixed;inset:0;background:rgba(10,16,30,.5);z-index:55;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);}
  .modal .mh{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
  .modal .mh h3{font-family:var(--fs-display);font-weight:600;font-size:18px;}
  .modal .mh .x{margin-left:auto;cursor:pointer;color:var(--muted);border:0;background:0;font-size:17px;}
  .modal .mb{padding:20px;display:flex;flex-direction:column;gap:14px;}

  .toast-wrap{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;flex-direction:column;gap:9px;}

    `<div class="role-seg">`+cfg.map(([id,l])=>`<button data-role="${id}" aria-pressed="${S.role[S.tab]===id}">${l}</button>`).join("")+`</div>`;
}

/* ============================================================ LBP */
function statusPill(s){
  const m={"with-pricer":"warn","with-pm":"warn","with-director":"warn","sale-confirm":"info","closed":"mut"};
  const l={"with-pricer":"with Pricer","with-pm":"with PM","with-director":"with Director","sale-confirm":"Sale to confirm","closed":"closed"}[s]||s;
  return `<span class="pill ${m[s]||"mut"}">${l}</span>`;
}
const decisionPill=d=>d==="Approved"?`<span class="pill good">Approved</span>`:d==="Rejected"?`<span class="pill bad">Rejected</span>`:"";
const canRPT=role=>["pricer","pm","director"].includes(role);

function lbpWrap(inner){
  const r=S.role.lbp;
  return `
  <div class="appwin">
    <div class="lbpbar"><span class="lg">LENOVO BID PLATFORM</span>
      <span class="sr">${r==="sale"?"Sales Rep":r==="pricer"?"Pricer · "+PRICER:r==="pm"?"Profit Mgr":r==="director"?"Director / CFO · "+DIRECTOR:"—"}</span></div>
    <div class="lbpwrap">${inner}</div>
  </div>`;
}
const LBP_LEDE=`<p class="lede"><b>Layer 1 — LBP (Lenovo Bid Platform).</b> Sale submits bids here; <b>Bid Type</b> is <span class="mono">Repricing</span> or <span class="mono">Exception</span>. Pricer / PM / Director open a bid — <b>RPT</b> (repricing calc) and <b>LPS</b> are tools inside each bid. Repricing is approved / rejected here with a comment Sale can read; the exception decision is made on the Tracker.</p>`;

function lbpWorkList(){
  const r=S.role.lbp;
  if(r==="sale") return lbpSaleList();
  const q={pricer:["with-pricer"],pm:["with-pm"],director:["with-director"]}[r];
  const active=S.bids.filter(b=>q.includes(b.lbpStatus));
  const mine=S.bids.filter(b=> r==="pricer"?effType(b)==="RPG":effType(b)==="Exception");
  return LBP_LEDE+`
  <div class="card" style="box-shadow:none"><h3>My Work List <span class="plat">${active.length} to action</span></h3>
    <div class="pad">
      ${active.length?`<div class="wl">${active.map(b=>wlRow(b)).join("")}</div>`:`<div class="callout good">Nothing waiting on you.</div>`}
      <div class="tiny" style="margin:16px 0 6px;text-transform:uppercase;letter-spacing:.06em">All ${r==="pricer"?"Repricing":"Exception"} bids</div>
      <table class="sheet"><thead><tr><th>Bid</th><th>Account</th><th>Type</th><th>Status</th><th>Decision</th></tr></thead>
        <tbody>${mine.map(b=>`<tr class="click" data-act="lbp-open" data-id="${b.id}">
          <td class="mono">${b.id}</td><td><b>${bidAcct(b).name}</b></td><td>${typeLabel(effType(b))}</td>
          <td>${statusPill(b.lbpStatus)}</td><td>${decisionPill(b.decision)}</td></tr>`).join("")}</tbody></table>
    </div>
  </div>`;
}
function wlRow(b){
  const a=bidAcct(b), et=effType(b);
  return `<div class="wlrow ${et==="Exception"?"exc":"rpg"}" data-act="lbp-open" data-id="${b.id}">
    <span class="stripe"></span>
    <span><span class="m1">${a.name} <span class="pill ${et==="Exception"?"yellow":"info"}">${typeLabel(et)}</span> ${statusPill(b.lbpStatus)}</span>
      <span class="m2">${b.id} · ${a.geo}/${a.vertical} · ${esc(b.description)}</span></span>
    <span class="chev">›</span></div>`;
}

function lbpSaleList(){
  const book=S.saleBook;
  const accOpts=S.accounts.filter(a=>a.mgr===book).map(a=>`<option value="${a.id}">${a.name} · ${a.geo} · ${a.vertical}${a.track?` (in ${typeLabel(a.track==="RPG"?"RPG":"Exception")})`:""}</option>`).join("");

  return LBP_LEDE+`
  <div class="grid2">
    <div class="card" style="box-shadow:none"><h3>New bid request <span class="plat">My Bid Requests</span></h3>
      <div class="pad stack">
        <div class="grid2">
          <div class="field"><label>Sales Rep book</label><select data-input="saleBook">${SALE_MGRS.map(m=>`<option ${m===book?"selected":""}>${m}</option>`).join("")}</select></div>
          <div class="field"><label>Account</label><select data-input="saleAcct">${accOpts.replace(`value="${sa}"`,`value="${sa}" selected`)}</select></div>
        </div>
        <div class="grid2">

            <select data-input="brBidType"><option>Repricing</option><option>Exception</option></select></div>
          <div class="field"><label>Bid Request Type</label>

        <div class="grid2">
          <div class="field"><label>Fulfillment Method</label>
            <select data-input="brFul"><option>Direct</option><option>Indirect</option></select></div>
          <div class="field"><label>Country</label><div class="ro">${A(sa).geo==="NA"?"United States":A(sa).geo==="EMEA"?"Germany":"Japan"}</div></div>
        </div>
        <div class="field"><label>Description</label><textarea data-input="brDesc" placeholder="e.g. Q1 renewal, 120 units, full per guidance">${esc(S._brDesc||"")}</textarea></div>
        <div><button class="btn primary" data-act="lbp-submit">Submit bid request</button></div>
        <div class="tiny">Bid Type <b>Repricing</b> → the bid goes to a Pricer. <b>Exception</b> → a <b>Sync to Tracker</b> window opens right away and the Profit Manager picks it up.</div>
      </div>
    </div>
    <div class="card" style="box-shadow:none"><h3>My Work List <span class="plat">${wl.length} need attention</span></h3>
      <div class="pad">
        ${wl.length?`<div class="wl">${wl.map(b=>{const a=bidAcct(b); const done=b.lbpStatus==="closed";
          return `<div class="wlrow ${done?(b.decision==="Rejected"?"rej":"done"):(b.type==="Exception"?"exc":"rpg")}" data-act="lbp-open" data-id="${b.id}">
            <span class="stripe"></span>
            <span><span class="m1">${a.name} <span class="pill ${b.type==="Exception"?"yellow":"info"}">${typeLabel(b.type)}</span> ${done?decisionPill(b.decision):`<span class="pill info">to confirm</span>`}</span>
              <span class="m2">${b.id} · ${esc(b.description)}</span></span>
            <span class="chev">›</span></div>`; }).join("")}</div>`
          :`<div class="callout good">Nothing waiting on you.</div>`}
        <div class="callout" style="margin-top:12px">🔒 RPT / LPS are Pricer / PM / Director tools — you'll see their comment feedback when you open a bid.</div>
      </div>
    </div>
  </div>`;
}

function lbpBidDetail(b){
  const a=bidAcct(b), r=S.role.lbp;
  const lm=b.lines.map(l=>{ const mg=lineMargin(l),p=linePrice(l);
    return `<tr class="${l.flag?"lineflag":""}"><td class="mono">${l.pn}</td><td class="mono">${l.memory} · ${l.ssd}</td>
      <td class="num">${money(l.base)}</td><td class="num">${p!=null?money(p):`<span class="pill warn">manual</span>`}</td>
      <td class="num">${mg==null?"—":mg.toFixed(1)+"%"}</td></tr>`; }).join("");
  const bm=bidMargin(b);

  const et=effType(b);
  let actions="";
  if(r==="sale"){
    if(b.lbpStatus==="sale-confirm") actions=`<button class="btn primary" data-act="sale-confirm-open" data-id="${b.id}">Confirm &amp; Sync to Tracker</button>`;
    else actions=`<span class="tiny">Read-only — this is a Pricer / PM / Director bid. Feedback below.</span>`;
  } else if(r==="pricer" && et==="RPG"){
    const open=["with-pricer"].includes(b.lbpStatus);
    actions=`<button class="btn ok" data-act="lbp-act" data-id="${b.id}" data-kind="approve" ${open?"":"disabled"}>Approve</button>
      <button class="btn danger" data-act="lbp-act" data-id="${b.id}" data-kind="reject" ${open?"":"disabled"}>Reject</button>
      <button class="btn ghost" data-act="lbp-act" data-id="${b.id}" data-kind="reassign" ${open?"":"disabled"}>Reassign</button>
      <span class="tiny">The note screen opens after you click Approve or Reject.</span>`;
  } else if(r==="pm" && et==="Exception"){
    const open=b.lbpStatus==="with-pm";
    actions=`<button class="btn ghost" data-act="lbp-act" data-id="${b.id}" data-kind="reassign" ${open?"":"disabled"}>Reassign to Director</button>
      <span class="tiny">The exception case (past performance, materials, send/save) is filled on the <b>Tracker</b> → Profit Mgr.</span>`;
  } else if(r==="director" && et==="Exception"){
    const open=b.lbpStatus==="with-director";
    actions=`<button class="btn ok" data-act="dir-decide" data-id="${a.id}" data-kind="approve" ${open?"":"disabled"}>Approve exception</button>
      <button class="btn danger" data-act="dir-decide" data-id="${a.id}" data-kind="reject" ${open?"":"disabled"}>Reject exception</button>
      <button class="btn ghost" data-act="lbp-act" data-id="${b.id}" data-kind="reassign" ${open?"":"disabled"}>Reassign to PM</button>

  } else actions=`<span class="tiny">No action for this role on this bid.</span>`;

  return `

    <b style="font-family:var(--fs-display);font-size:19px">${a.name}</b>
    <span class="pill ${b.type==="Exception"?"yellow":"info"}">${typeLabel(b.type)}</span>
    ${statusPill(b.lbpStatus)} ${decisionPill(b.decision)}
  </div>
  <div class="stack">
    <div class="card" style="box-shadow:none"><div class="pad">
      <div class="bidsum">
        <div class="field"><label>Bid ID</label><div class="ro">${b.id}${b.manual?" · manual":""}</div></div>
        <div class="field"><label>Account · Geo</label><div class="ro">${a.name} · ${a.geo}</div></div>
        <div class="field"><label>Vertical</label><div class="ro">${a.vertical}</div></div>
        <div class="field"><label>Bid Request Type</label><div class="ro">${b.bidReqType}</div></div>
        <div class="field"><label>Fulfillment</label><div class="ro">${b.fulfillment}</div></div>
        <div class="field"><label>Submitted by</label><div class="ro">${b.submittedBy} · ${b.submittedAt}</div></div>
      </div>
      <div class="field" style="margin-top:12px"><label>Description</label><div class="ro">${esc(b.description||"—")}</div></div>
    </div></div>

    <div class="card" style="box-shadow:none"><h3>Bid lines <span class="plat">${b.rptRan?"priced in RPT":"not yet priced"}</span></h3>
      <div class="pad" style="overflow-x:auto">
        <table class="sheet"><thead><tr><th>PN</th><th>Memory · SSD</th><th class="num">Prev</th><th class="num">New</th><th class="num">Margin</th></tr></thead>
          <tbody>${lm}</tbody>
          <tfoot><tr class="total"><td colspan="4">Blended margin</td><td class="num">${bm==null?"—":bm.toFixed(1)+"%"}</td></tr></tfoot></table>
        <div class="toolrow" style="margin-top:12px">
          ${canRPT(r)? `<button class="btn ghost" data-act="tool-open" data-id="${b.id}" data-tool="rpt">Open RPT</button>
            <button class="btn ghost" data-act="tool-open" data-id="${b.id}" data-tool="lps">Open LPS</button>`

        </div>

    <div class="card" style="box-shadow:none"><h3>Actions &amp; comments</h3>
      <div class="pad stack">
        <div class="toolrow">${actions}</div>
        <div>
          <div class="tiny" style="margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em">Comment thread</div>
          <div class="commentthread">
            ${b.comments.length? b.comments.map(c=>`<div class="cmt ${c.kind}">
              <div class="h"><b>${c.by}</b> · ${c.role} · ${c.kind} · ${c.ts}</div>${esc(c.text)}</div>`).join("")
              : `<div class="tiny">No comments yet — a comment is added when someone approves, rejects, or reassigns the bid.</div>`}
          </div>
        </div>
      </div>

  </div>`;
}

/* ---------- RPT (identical for pricer / PM / director) ---------- */
function rptScreen(b){
  const a=bidAcct(b), role=S.role.lbp, rec=rptRecord(b.id,role);
  const ran=b.rptRan||!!rec;
  const steps=[
    ["Bid + comment auto-ingested",`Bid ${b.id} from LBP · comment parsed`],
    ["Auto-fetch ref bid + original price",`ref ${b.lines[0].refBid}`],
    ["Auto-read memory / SSD config",`DDR5 / G4 · G4P resolved per PN`],
    ["Auto-match PN → catalog model",`special CPUs flagged for a manual price`],
    ["Apply guidance uplift · line-by-line margin",`GTP FY26 Aug · +10%`]
  ];
  const checks=steps.map((s,i)=>`<div class="check ${ran?"pass":""}"><span class="ico">${ran?"✓":i+1}</span>
    <span><span class="lab">${s[0]}</span><span class="det">${ran?s[1]:"&nbsp;"}</span></span></div>`).join("");
  let result;
  if(!ran){
    result=`<div style="margin-top:12px"><button class="btn primary" data-act="rpt-run" data-id="${b.id}">▶ Run</button></div>`;
  } else {
    const rows=b.lines.map((l,i)=>{ const mg=lineMargin(l);
      const inp=`<input class="mono" style="width:104px;padding:5px 6px;border:1px solid var(--border-strong);border-radius:5px;background:var(--surface);color:var(--ink);text-align:right" placeholder="${l.flag?"manual $":""}" data-linebid="${b.id}" data-line="${i}" value="${hasManual(l)?l.manualPrice:(l.flag?"":l.newPrice.toFixed(2))}">`;
      return `<tr class="${l.flag?"lineflag":""}">
        <td class="mono">${l.pn}<div class="tiny">${l.family}</div></td>
        <td class="mono">${l.refBid}</td><td class="num">${money(l.base)}</td>
        <td class="mono">${l.memory}<div class="tiny">${l.ssd}</div></td>
        <td class="mono">${l.cpu}${l.flag?` <span class="pill bad">RTX · manual</span>`:""}</td>
        <td class="num">${inp}</td>
        <td class="num" id="lm-${b.id}-${i}">${mg==null?`<span class="pill warn">enter $</span>`:mg.toFixed(1)+"%"}</td></tr>`;
    }).join("");
    const bm=bidMargin(b);
    result=`<div style="overflow-x:auto;margin-top:12px"><table class="sheet">
      <thead><tr><th>PN / model</th><th>Ref bid</th><th class="num">Orig.</th><th>Memory / SSD</th><th>CPU</th><th class="num">New price</th><th class="num">Margin</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr class="total"><td colspan="6">Blended margin</td><td class="num" id="bm-${b.id}">${bm==null?`<span class="pill warn">enter manual line</span>`:bm.toFixed(1)+"%"}</td></tr></tfoot>
      </table></div>
      <div class="field" style="margin-top:12px"><label>Extra notes (added to the pricing note)</label>
        <textarea data-input="pricerNote" data-id="${b.id}" placeholder="anything else the record needs…">${esc(b.pricerNote)}</textarea></div>`;
  }
  return `
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
    <button class="btn ghost sm" data-act="tool-close">← Back to bid</button>
    <b style="font-family:var(--fs-display);font-size:18px">RPT · ${a.name}</b>
    <span class="tiny mono">${b.id} · ${typeLabel(b.type)} · same tool for Pricer / PM / Director</span>
    <span style="margin-left:auto"></span>
    ${rec?`<span class="pill good">saved · ${rec.id}</span>`:""}
  </div>
  <div class="stack">
    <div class="appwin"><div class="bar"><span class="dots"><i></i><i></i><i></i></span> Automated repricing calc <span class="plat">${b.id}</span></div>
      <div class="body"><div class="checks">${checks}</div>${result}</div></div>
    <div class="field"><label>Pricing note (generated)</label>
      <div class="notebox" id="rpt-note">${esc(ran?pricingNote(b):"Run first to generate the note.")}</div></div>
    <div class="toolrow">
      <button class="btn ghost" data-act="rpt-lps" data-id="${b.id}" ${b.lpsSynced||!ran?"disabled":""}>${b.lpsSynced?"✓ Synced to LPS":"↔ Sync to LPS"}</button>
      <button class="btn ghost" data-act="rpt-copy" data-id="${b.id}" ${ran?"":"disabled"}>⧉ Copy pricing note</button>
      <button class="btn primary" data-act="rpt-save" data-id="${b.id}" ${ran?"":"disabled"}>${rec?"Update saved record":"Save record"}</button>
    </div>
    <div class="callout">RPT calculates and records — it never approves. Repricing bids are decided on the LBP bid; exception bids on the Tracker.</div>
  </div>`;
}
function lpsScreen(b){
  const a=bidAcct(b);
  const rows=b.lines.map(l=>{ const p=linePrice(l);
    return `<tr><td class="mono">${l.pn}</td><td class="num">${money(l.base)}</td>
      <td class="num">${b.lpsSynced&&p!=null?money(p):"<span class='tiny'>not synced</span>"}</td>
      <td class="num">${b.lpsSynced&&p!=null?((p-l.base)>=0?"+":"")+money(p-l.base):"—"}</td></tr>`; }).join("");
  return `
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
    <button class="btn ghost sm" data-act="tool-close">← Back to bid</button>
    <b style="font-family:var(--fs-display);font-size:18px">LPS · ${a.name}</b>

  </div>
  <div class="card" style="box-shadow:none"><h3>LPS — contract pricing <span class="plat">read from LPS</span></h3>
    <div class="pad">

      <div class="callout ${b.lpsSynced?"good":"info"}" style="margin-top:12px">

/* ============================================================ Tracker */

/* ============================================================ Reporting */
function vwReport(kind){
  const F=S.reportFilter, all=S.accounts, R=computeReport(all);
  const geos=["All",...new Set(all.map(a=>a.geo))], verts=["All",...new Set(all.map(a=>a.vertical))];
  const gvMatch=a=>(F.geo==="All"||a.geo===F.geo)&&(F.vertical==="All"||a.vertical===F.vertical);
  const clsMatch=a=>F.excClass==="All"||excClassOf(a)===F.excClass;
  const exc=R.exceptions.filter(a=>gvMatch(a)&&clsMatch(a));
  const miss=R.missing.filter(gvMatch);
  const uplTable=`<table class="sheet"><thead><tr><th>Bucket</th><th class="num">Accounts</th><th class="num">% of active</th></tr></thead>
    <tbody>${upRow("Full uplift",R.b.full,R.active)}${upRow("Partial uplift",R.b.partial,R.active)}${upRow("No uplift",R.b.none,R.active)}${upRow("Missing input",R.b.missing,R.active)}</tbody>
    <tfoot><tr class="total"><td>Active total</td><td class="num">${R.active}</td><td class="num">100%</td></tr></tfoot></table>`;
  const chart=kind==="GA"?decompTree(R):verticalBreakdown();

  // exception sizing by class (respecting geo/vertical filter, ignoring the class filter)
  const excGV=R.exceptions.filter(gvMatch);
  const sizeOf=cls=>{ const g=excGV.filter(a=>excClassOf(a)===cls);
    const rev=g.reduce((s,a)=>s+acctFin(a).rev,0), gp=g.reduce((s,a)=>s+acctFin(a).gp,0), imp=g.reduce((s,a)=>s+acctFin(a).impact,0);
    return {n:g.length,rev,gp,imp}; };
  const sPartial=sizeOf("Partial Exception"), sFull=sizeOf("Full Exception");
  const sizeCard=(label,s,color)=>`<div class="stat" style="border-left:4px solid ${color}">
    <div class="v">${s.n}</div><div class="l">${label}</div>
    <div class="s">Rev ${m2(s.rev)} · GP ${m2(s.gp)} · GP Impact ${m2(s.imp)}</div></div>`;

  return `
  <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:6px">
    <p class="lede" style="margin:0"><b>Layer 3 — Reporting (Power BI, live from the Tracker's Main Table).</b> ${kind==="GA"?"The <b>GA</b> page decomposes the book by status.":"The <b>GTP</b> page breaks it down by vertical."} <b>Partial Uplift → Partial Exception</b>, <b>No Uplift → Full Exception</b> — filterable below for sizing.</p>
    <span class="tiny mono">As of ${today()}</span>
  </div>
  <div class="statgrid" style="margin-bottom:16px">
    <div class="stat"><div class="v">${R.total}</div><div class="l">GA accounts</div></div>
    <div class="stat"><div class="v">${R.active}</div><div class="l">Active</div><div class="s">${pct(R.active,R.total)}</div></div>
    <div class="stat"><div class="v">${R.notActive}</div><div class="l">Not active</div></div>
    <div class="stat"><div class="v">${R.b.missing}</div><div class="l">Missing input</div><div class="s">${pct(R.b.missing,R.active)} of active</div></div>
    ${sizeCard("Partial Exception",sPartial,"var(--warn)")}
    ${sizeCard("Full Exception",sFull,"var(--bad)")}
  </div>
  <div class="card" style="margin-bottom:16px"><h3>${kind==="GA"?"GA account decomposition":"GTP — accounts by vertical"} <span class="plat">Power BI</span></h3>
    <div class="pad cols2" style="align-items:start"><div style="overflow-x:auto">${chart}</div><div>${uplTable}</div></div></div>
  <div class="card"><h3>Exception &amp; missing-input detail</h3>
    <div class="pad">
      <div class="filterbar">
        <div class="field"><label>Geo</label><select data-input="fGeo">${geos.map(g=>`<option ${g===F.geo?"selected":""}>${g}</option>`).join("")}</select></div>
        <div class="field"><label>Vertical</label><select data-input="fVert">${verts.map(v=>`<option ${v===F.vertical?"selected":""}>${v}</option>`).join("")}</select></div>
        <div class="field"><label>Exception class</label><select data-input="fExcClass">${["All","Partial Exception","Full Exception"].map(c=>`<option ${c===F.excClass?"selected":""}>${c}</option>`).join("")}</select></div>
        ${(F.geo!=="All"||F.vertical!=="All"||F.excClass!=="All")?`<button class="btn ghost sm" data-act="rep-clear">Clear</button>`:""}
      </div>
      <div class="tiny" style="margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em">Exception accounts · ${exc.length}</div>
      <div style="overflow-x:auto"><table class="sheet">
        <thead><tr><th>HQ Geo</th><th>Account</th><th>ISR</th><th>GAM</th><th>Class</th><th>Q10 Valid Date</th><th>CA No.</th><th class="num">Exc REV $(M)</th><th class="num">GP $(M)</th><th class="num">GP Impact $(M)</th><th>Stage / Decision</th></tr></thead>
        <tbody>${exc.map(a=>{ const f=acctFin(a); const cls=excClassOf(a);
          return `<tr><td>${a.geo}</td><td><b>${a.name}</b></td><td class="mono">${a.sp.split("@")[0]}</td><td>${a.gam}</td>
          <td><span class="pill ${cls==="Partial Exception"?"warn":"bad"}">${cls||"—"}</span></td>
          <td class="mono">${a.effective||"—"}</td><td class="mono">${a.caNo||"—"}</td>
          <td class="num">${(f.rev/1e6).toFixed(2)}</td><td class="num">${(f.gp/1e6).toFixed(2)}</td><td class="num">${(f.impact/1e6).toFixed(2)}</td>
          <td>${a.exception?.decision?decisionPill(a.exception.decision):`<span class="pill yellow">${a.exception?.stage||"pending"}</span>`}</td></tr>`; }).join("")
          || `<tr><td colspan="11" class="tiny">none match the filter</td></tr>`}</tbody></table></div>

      <div class="tiny" style="margin:16px 0 6px;text-transform:uppercase;letter-spacing:.06em">Missing input · ${miss.length}</div>
      <table class="sheet"><thead><tr><th>Account</th><th>Geo / Vert</th><th>ISR</th><th>Sale Mgr</th><th>Last updated</th></tr></thead>
        <tbody>${miss.map(a=>`<tr><td><b>${a.name}</b></td><td class="mono">${a.geo}/${a.vertical}</td><td class="mono">${a.sp.split("@")[0]}</td><td>${a.mgr}</td><td class="mono">${a.lastAt||"never"}</td></tr>`).join("")||`<tr><td colspan="5" class="tiny">none</td></tr>`}</tbody></table>
    </div></div>`;
}
function upRow(label,n,base){
  const c={"Full uplift":"var(--good)","Partial uplift":"var(--warn)","No uplift":"var(--bad)","Missing input":"var(--border-strong)"}[label];
  return `<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${c};margin-right:7px"></span>${label}</td><td class="num">${n}</td><td class="num">${pct(n,base)}</td></tr>`;
}
function decompTree(R){
  const bar=(v,max,color)=>`<div class="tn-bar"><i style="width:${max?Math.round(v/max*100):0}%;background:${color}"></i></div>`;
  const mt=Math.max(R.active,R.notActive,1), mb=Math.max(R.b.full,R.b.partial,R.b.none,R.b.missing,1);
  return `<div class="tree">
    <div class="tcol"><div class="tnode root"><div class="tn-l">GA portfolio</div><div class="tn-v">${R.total}</div></div></div>
    <div class="tcol links"><div class="lwrap"><span class="link"></span><span class="link"></span></div></div>
    <div class="tcol">
      <div class="tnode"><div class="tn-l">Active</div><div class="tn-v">${R.active}</div>${bar(R.active,mt,"var(--good)")}</div>
      <div class="tnode"><div class="tn-l">Not active</div><div class="tn-v">${R.notActive}</div>${bar(R.notActive,mt,"var(--muted)")}</div></div>
    <div class="tcol links"><div class="lwrap"><span class="link"></span></div></div>
    <div class="tcol">
      <div class="tnode"><div class="tn-l">Full uplift</div><div class="tn-v">${R.b.full}</div>${bar(R.b.full,mb,"var(--good)")}</div>
      <div class="tnode"><div class="tn-l">Partial uplift</div><div class="tn-v">${R.b.partial}</div>${bar(R.b.partial,mb,"var(--warn)")}</div>
      <div class="tnode"><div class="tn-l">No uplift</div><div class="tn-v">${R.b.none}</div>${bar(R.b.none,mb,"var(--bad)")}</div>
      <div class="tnode"><div class="tn-l">Missing input</div><div class="tn-v">${R.b.missing}</div>${bar(R.b.missing,mb,"var(--border-strong)")}</div></div>
  </div>`;
}
function verticalBreakdown(){
  const verts=[...new Set(S.accounts.map(a=>a.vertical))];
  return `<div class="treemap">`+verts.map(v=>{
    const sub=S.accounts.filter(a=>a.vertical===v), R=computeReport(sub);
    const seg=(n,color)=>n?`<i style="width:${n/Math.max(R.active,1)*100}%;background:${color}"></i>`:"";
    return `<div class="tm"><h4>${v} <span>${sub.length} acct · ${R.active} active</span></h4>
      <div class="stack">${seg(R.b.full,"var(--good)")}${seg(R.b.partial,"var(--warn)")}${seg(R.b.none,"var(--bad)")}${seg(R.b.missing,"var(--border-strong)")}</div>
      <div class="key"><span><b style="background:var(--good)"></b>Full ${R.b.full}</span><span><b style="background:var(--warn)"></b>Partial ${R.b.partial}</span>
        <span><b style="background:var(--bad)"></b>None ${R.b.none}</span><span><b style="background:var(--border-strong)"></b>Missing ${R.b.missing}</span></div></div>`;
  }).join("")+`</div>`;
}

function renderOverlay(){
  const o=$("#overlay");
  if(!S.overlay){ o.innerHTML=""; return; }
  if(S.overlay==="log"){ o.innerHTML=`<div class="scrim" data-act="close-overlay"><div class="drawer" onclick="event.stopPropagation()">
    <div class="dh">Activity log <span class="tiny" style="font-weight:400">· = writes to Tracker</span><button class="x" data-act="close-overlay">✕</button></div>
    <div class="dc" id="logBody"></div></div></div>`; renderLogDrawer(); return; }
  const parts=S.overlay.split(":"), kind=parts[0], arg=parts[1];
  if(kind==="sync-rpg") o.innerHTML=syncRpgModal(arg);
  else if(kind==="sync-exc") o.innerHTML=syncExcModal(arg);
  else if(kind==="act") o.innerHTML=actModal(parts[1],parts[2]);
  else if(kind==="dir") o.innerHTML=dirDecideModal(parts[1],parts[2]);
  else if(kind==="rec") o.innerHTML=recModal(arg);

}

/* ============================================================ bind */
function bind(){
  $$("[data-input]").forEach(node=>{
    const key=node.dataset.input;
    node.onchange=()=>inputChange(key,node.value,node);
    if(node.tagName==="TEXTAREA"||node.tagName==="INPUT") node.oninput=()=>inputChange(key,node.value,node,true);
  });
  $$("[data-linebid]").forEach(inp=>{
    inp.oninput=()=>{ const b=B(inp.dataset.linebid); if(!b)return;
      const i=+inp.dataset.line, l=b.lines[i];
      l.manualPrice=inp.value.replace(/[^0-9.]/g,"");
      const mc=document.getElementById("lm-"+b.id+"-"+i);
      if(mc){ const mg=lineMargin(l); mc.innerHTML=mg==null?'<span class="pill warn">enter $</span>':mg.toFixed(1)+"%"; }
      const f=document.getElementById("bm-"+b.id);
      if(f){ const bm=bidMargin(b); f.innerHTML=bm==null?'<span class="pill warn">enter manual line</span>':bm.toFixed(1)+"%"; }
      const nb=document.getElementById("rpt-note"); if(nb) nb.textContent=pricingNote(b);
    };
  });
  $$("[data-crow]").forEach(inp=>{ inp.oninput=()=>{ S.calc.rows[+inp.dataset.i][inp.dataset.crow]=inp.value.replace(/[^0-9.]/g,""); }; });
  $$("[data-act]").forEach(n=>{ n.onclick=e=>{ e.stopPropagation(); (ACT[n.dataset.act]||(()=>{}))(n.dataset,e,n); }; });
  $$("[data-tab]").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; S.sel.lbpBid=null; S.lbpTool=null; render(); });
  $$("[data-role]").forEach(b=>{ if(b.dataset.act)return; b.onclick=()=>{ S.role[S.tab]=b.dataset.role; S.sel.lbpBid=null; S.lbpTool=null; render(); }; });
}
function inputChange(key,val,node,silent){
  switch(key){
    case "saleBook": S.saleBook=val; S.sel.saleAcct=null; render(); break;
    case "saleAcct": S.sel.saleAcct=val; render(); break;
    case "brBidType": S._brBidType=val; break;
    case "brType": S._brType=val; break;
    case "brFul": S._brFul=val; break;
    case "brDesc": S._brDesc=val; break;
    case "excReason": S._excReason=val; break;
    case "excAsk": S._excAsk=val; break;
    case "q_active": S._qActive=val; break;
    case "q_uplift": S._qUplift=val; break;
    case "q_eff": S._qEff=val; break;
    case "q_lnl": S._qLnl=val; break;
    case "q_ca": S._qCa=val; break;
    case "excUplift": S._excUplift=val; break;
    case "fExcClass": S.reportFilter.excClass=val; render(); break;
    case "edActive": { const a=A(node.dataset.id); if(a){ a.active=val==="Yes"; a.exception&&(a.exception.class=excClassOf(a)); } if(!silent) render(); break; }
    case "edUplift": { const a=A(node.dataset.id); if(a){ a.uplift=val; a.guidance=GUID_OF[val]||a.guidance; if(val!=="Full Uplift" && a.track!=="Exception"){ a.track="Exception"; a.exception=a.exception||{stage:"PM-intake",reason:"(re-classified by "+(S.role.tracker||"user")+")",ask:"",performance:"",materials:[],submittedBy:null,submittedAt:null,decision:null,decisionNote:"",calc:null,draftSaved:false}; } } if(!silent) render(); break; }
    case "edEff": { const a=A(node.dataset.id); if(a) a.effective=val; break; }
    case "edLnl": { const a=A(node.dataset.id); if(a) a.lnl=val==="Yes"; break; }
    case "edCa": { const a=A(node.dataset.id); if(a) a.caNo=val; break; }
    case "actNote": S._actNote=val; break;
    case "reassignTo": S._reassignTo=val; break;
    case "freeCmt": S._freeCmt=val; break;
    case "pricerNote": { const b=B(node.dataset.id); if(b){ b.pricerNote=val; const nb=document.getElementById("rpt-note"); if(nb)nb.textContent=pricingNote(b);} break; }
    case "perf": { const a=A(node.dataset.id); if(a&&a.exception) a.exception.performance=val; break; }
    case "recSearch": S.sel.recSearch=val; if(!silent) render(); break;
    case "addAcct": S._addAcct=val; break;
    case "addType": S._addType=val; break;
    case "addReq": S._addReq=val; break;
    case "addDesc": S._addDesc=val; break;
    case "fGeo": S.reportFilter.geo=val; render(); break;
    case "fVert": S.reportFilter.vertical=val; render(); break;
  }
}

/* ============================================================ actions */
const ACT={
  "open-log"(){ S.overlay="log"; renderOverlay(); bind(); },
  "close-overlay"(){ S.overlay=null; render(); },
  "reset-all"(){ S=freshState(); render(); toast("Demo reset."); },

  /* LBP nav */
  "lbp-open"(d){ S.sel.lbpBid=d.id; S.lbpTool=null; render(); },
  "lbp-back"(){ S.sel.lbpBid=null; S.lbpTool=null; render(); },
  "tool-open"(d){ if(!canRPT(S.role.lbp)){ toast("RPT / LPS are Pricer / PM / Director only."); return; } S.lbpTool=d.tool; render(); },
  "tool-close"(){ S.lbpTool=null; render(); },

  /* LBP · Sale submit */
  "lbp-submit"(){
    const a=A(S.sel.saleAcct)||S.accounts.find(x=>x.mgr===S.saleBook);
    const isExc=(S._brBidType||"Repricing")==="Exception";
    const b=mkBid({id:nextBid(),accountId:a.id,type:isExc?"Exception":"RPG",description:(S._brDesc||"").trim(),
      bidReqType:S._brType||"Renewal",fulfillment:S._brFul||"Direct",submittedBy:a.sp.split("@")[0],
      lbpStatus:isExc?"with-pm":"with-pricer",lineIdx:[0,1,2]});
    S.bids.unshift(b); S._brDesc="";
    if(isExc){
      a.track="Exception";
      a.exception={stage:"PM-intake",reason:"",ask:"",performance:"",materials:[],submittedBy:null,submittedAt:null,decision:null,decisionNote:"",calc:null,draftSaved:false};
      a.lastBy=a.sp.split("@")[0]; a.lastAt=todayStamp();
      log(`Sale submitted <b>${a.name}</b> in LBP — Bid Type <b>Exception</b> (${b.id}).`, true);
      S.overlay="sync-exc:"+b.id; renderOverlay(); bind();
    } else {
      log(`Sale submitted <b>${a.name}</b> in LBP — <b>Repricing</b> (${b.id}) → Pricer.`, true);
      toast(`${a.name} · Repricing → Pricer.`); render();
    }
  },
  "sync-exc-submit"(d){
    const b=B(d.id), a=bidAcct(b);
    a.exception.reason=S._excReason||""; a.exception.ask=S._excAsk||"";
    a.uplift=S._excUplift||"No Uplift"; a.guidance=GUID_OF[a.uplift];
    a.caNo=S._qCa||a.caNo; a.lastBy=a.sp.split("@")[0]; a.lastAt=todayStamp();
    a.exception.class=excClassOf(a);
    S._excReason=""; S._excAsk=""; S._qCa=""; S._excUplift=""; S.overlay=null;
    log(`Sync to Tracker — <b>${a.name}</b> as a <b>${a.exception.class}</b>. PM ${PM_OF[a.mgr]} picks it up in LBP.`, true);
    toast(`${a.name} synced to Tracker (${a.exception.class}).`);
    render();
  },
  "sale-confirm-open"(d){ S.overlay="sync-rpg:"+d.id; renderOverlay(); bind(); },
  "sync-rpg-submit"(d){
    const b=B(d.id), a=bidAcct(b);
    a.active=(S._qActive||"Yes")==="Yes";
    a.uplift=S._qUplift||"Full Uplift"; a.guidance=GUID_OF[a.uplift];
    a.effective=S._qEff||"2026-02-01"; a.lnl=(S._qLnl||"No")==="Yes"; a.caNo=S._qCa||a.caNo;
    a.lastBy=a.sp.split("@")[0]; a.lastAt=todayStamp();
    S._qCa=""; S.overlay=null; S.sel.lbpBid=null;
    if(a.uplift==="Full Uplift"){
      a.track="RPG"; b.lbpStatus="closed";
      log(`Sync to Tracker — <b>${a.name}</b> confirmed: <b>Full Uplift</b> · valid ${a.effective} · LNL ${a.lnl?"yes":"no"}.`, true);
      toast(`${a.name} synced — Full Uplift (Repricing).`);
    } else {
      a.track="Exception";
      const cls=excClassOf(a);
      a.exception={stage:"PM-intake", reason:`Customer agreed to ${a.uplift} only.`, ask:a.uplift==="Partial Uplift"?"Partial uplift vs 10% guided":"0% uplift vs 10% guided",
        performance:"", materials:[], submittedBy:null, submittedAt:null, decision:null, decisionNote:"", calc:null, draftSaved:false, class:cls};
      b.lbpStatus="with-pm";
      log(`Sync to Tracker — <b>${a.name}</b> confirmed <b>${a.uplift}</b> → <b>${cls}</b>. Routed to PM ${PM_OF[a.mgr]}.`, true);
      toast(`${a.name} → ${cls} (to Profit Manager).`);
    }
    render();
  },

  /* RPT */
  "rpt-run"(d){ const b=B(d.id); b.rptRan=true;
    log(`RPT run · ${S.role.lbp} · <b>${bidAcct(b).name}</b> (${b.id}).`); render(); },
  "rpt-lps"(d){ const b=B(d.id); b.lpsSynced=true;
    log(`RPT → Sync to LPS · <b>${bidAcct(b).name}</b> (${b.id}) — pending write permissions.`);
    toast("Queued to LPS."); render(); },
  "rpt-copy"(d){ const b=B(d.id); copyText(pricingNote(b)); toast("Pricing note copied to clipboard."); },
  "rpt-save"(d){
    const b=B(d.id), a=bidAcct(b), role=S.role.lbp;
    const note=pricingNote(b);
    const savedBy=role==="pricer"?PRICER:role==="pm"?PM_OF[a.mgr]:DIRECTOR;
    let rec=rptRecord(d.id,role);
    if(rec){ rec.note=note; rec.ts=todayStamp(); toast("Record updated."); }
    else { rec={id:nextRpt(),bidId:d.id,account:a.name,role,savedBy,ts:todayStamp(),note}; S.rptRecords.unshift(rec); toast(`Saved as ${rec.id}.`); }
    log(`RPT record ${rec.id} saved · ${role} · <b>${a.name}</b>.`, true);
    render();
  },

  /* LBP decisions / comments */
  "lbp-act"(d){ S._actNote=""; S._reassignTo=""; S.overlay="act:"+d.kind+":"+d.id; renderOverlay(); bind(); },
  "act-confirm"(d){
    const b=B(d.id), a=bidAcct(b), role=S.role.lbp, kind=d.kind;
    const by=role==="pricer"?PRICER:role==="pm"?PM_OF[a.mgr]:DIRECTOR;
    const text=S._actNote||"";
    if(kind==="approve"){
      b.decision="Approved"; b.decisionBy=by; b.lbpStatus="sale-confirm";
      addComment(b,"approve",role,by,text||"Approved.");
      log(`${role==="pricer"?"Pricer":"Director"} <b>approved</b> ${b.id} (${a.name}) in LBP. → Sale to confirm.`, true);
      toast(`${a.name} approved.`);
    } else if(kind==="reject"){
      b.decision="Rejected"; b.decisionBy=by; b.lbpStatus="closed";
      addComment(b,"reject",role,by,text||"Rejected.");
      a.unread.sale=true;
      log(`${role} <b>rejected</b> ${b.id} (${a.name}) in LBP — ${esc(text||"no reason given")}. Back to Sale.`, true);
      toast(`${a.name} rejected.`);
    } else {
      const to=S._reassignTo||"Director / CFO";
      const target=/Director/.test(to)?"director":"pm";
      b.lbpStatus="with-"+target;
      if(target==="director"&&a.exception&&a.exception.stage==="PM-intake") a.exception.stage="Director-review", a.exception.submittedBy=PM_OF[a.mgr], a.exception.submittedAt=todayStamp();
      if(target==="pm"&&a.exception) a.exception.stage="PM-intake";
      addComment(b,"reassign",role,by,(text||"Reassigned.")+" → "+to);
      log(`${role} <b>reassigned</b> ${b.id} (${a.name}) → ${to}.`, true);
      toast(`${a.name} reassigned to ${to}.`);
    }
    S.overlay=null; S._actNote=""; render();
  },

  /* RPT records */
  "rec-view"(d){ S.overlay="rec:"+d.id; renderOverlay(); bind(); },
  "rec-copy"(d){ const r=S.rptRecords.find(x=>x.id===d.id); if(r){ copyText(r.note); toast("Note copied."); } },

  /* Tracker · PM */
  "trk-board"(d){ if(d.role==="pm") S.sel.trkPM=d.id; else S.sel.trkDir=d.id; render(); },
  "trk-mark-read"(d){ const a=A(d.id); a.unread.pm=false; log(`PM read the decision on <b>${a.name}</b>.`); render(); },
  "pm-flag"(d){ const a=A(d.id); a.track="Exception";
    a.exception={stage:"PM-intake",reason:"(flagged by PM)",ask:"",performance:"",materials:[],submittedBy:PM_OF[a.mgr],submittedAt:null,decision:null,decisionNote:"",calc:null,draftSaved:false};
    log(`PM ${PM_OF[a.mgr]} flagged <b>${a.name}</b> as an Exception.`, true); render(); },
  "pm-attach"(d){ const a=A(d.id); if(a.exception&&!a.exception.materials.includes("tmcgp_bridge_fy26.xlsx")) a.exception.materials.push("tmcgp_bridge_fy26.xlsx"); render(); },
  "pm-save"(d){ const a=A(d.id); a.exception.draftSaved=true;
    log(`PM saved the <b>${a.name}</b> exception draft on the Tracker.`, true); toast("Draft saved."); render(); },
  "pm-send"(d){ const a=A(d.id), e=a.exception;
    if(!(e.performance||"").trim()){ toast("Add the account's past performance first."); return; }
    e.stage="Director-review"; e.submittedBy=PM_OF[a.mgr]; e.submittedAt=todayStamp(); e.draftSaved=true;
    if(!e.materials.length) e.materials.push("tmcgp_bridge_fy26.xlsx");
    const b=S.bids.find(x=>x.accountId===a.id&&x.type==="Exception"); if(b) b.lbpStatus="with-director";
    log(`PM ${e.submittedBy} <b>sent</b> the <b>${a.name}</b> exception to Director/CFO (Tracker).`, true);
    toast(`${a.name} → Director/CFO.`); render(); },
  "pm-reject"(d){ const a=A(d.id), e=a.exception;
    e.stage="Rejected"; e.decision="Rejected"; e.decisionNote="Returned by PM — insufficient justification to escalate.";
    a.unread.sale=true;
    const b=S.bids.find(x=>x.accountId===a.id&&x.type==="Exception"); if(b){ b.lbpStatus="closed"; b.decision="Rejected"; addComment(b,"reject","pm",PM_OF[a.mgr],e.decisionNote); }
    log(`PM ${PM_OF[a.mgr]} <b>rejected</b> the <b>${a.name}</b> exception back to Sale.`, true);
    toast(`${a.name} exception returned to Sale.`); render(); },

  /* Tracker · Director */
  "calc-add"(){ S.calc.rows.push({u:0,rev:0,t:0}); render(); },
  "calc-del"(d){ S.calc.rows.splice(+d.i,1); if(!S.calc.rows.length)S.calc.rows.push({u:0,rev:0,t:0}); render(); },
  "calc-run"(d){ const out=runCalc(d.id); log(`Tracker KPI calc · <b>${A(d.id).name}</b> — TMCGP% ${out.totPct.toFixed(2)}%, ${pp(out.bwPct)} vs MT.`); render(); },
  "dir-decide"(d){
    const a=A(d.id);
    S._actNote = d.kind==="approve"
      ? "Approved. "+(a.exception.ask||"the request")+" is acceptable given account history; TMCGP% impact within MT tolerance."
      : "Rejected. Impact exceeds MT tolerance; renegotiate volume commitment.";
    S.overlay="dir:"+d.kind+":"+d.id; renderOverlay(); bind();
  }
};

ACT["dir-confirm"]=function(d){
  const a=A(d.id), e=a.exception, kind=d.kind;
  const note=S._actNote||(kind==="approve"?"Approved.":"Rejected.");
  e.decision=kind==="approve"?"Approved":"Rejected";
  e.stage=e.decision; e.decisionNote=note;
  if(S.calc.out&&S.calc.acctId===a.id) e.calc={totPct:S.calc.out.totPct,bwPct:S.calc.out.bwPct};
  a.unread.sale=true; a.unread.pm=true;
  if(kind==="approve"&&!a.guidance) a.guidance="Partial";
  const b=S.bids.find(x=>x.accountId===a.id&&x.type==="Exception");
  if(b){ b.lbpStatus="closed"; b.decision=e.decision; addComment(b,kind==="approve"?"approve":"reject","director",DIRECTOR,note); }
  S.overlay=null; S._actNote="";
  log(`Director/CFO <b>${e.decision}</b> the <b>${a.name}</b> exception on the Tracker. Synced; PM + Sale notified.`, true);
  toast(`${a.name} exception ${e.decision.toLowerCase()}.`);
  render();
};

/* Tracker · add new */
ACT["add-open"]=function(d){ S._addAcct=S.accounts[0].id; S._addType="Repricing"; S._addReq="Renewal"; S._addDesc="";
  S.overlay="add:"+d.who; renderOverlay(); bind(); };
ACT["add-submit"]=function(d){
  const a=A(S._addAcct)||S.accounts[0];
  const isExc=(S._addType||"Repricing")==="Exception";
  const b=mkBid({id:nextBid(),accountId:a.id,type:isExc?"Exception":"RPG",description:(S._addDesc||"manual entry"),
    bidReqType:S._addReq||"Renewal",submittedBy:d.who==="pm"?PM_OF[a.mgr]:a.sp.split("@")[0],manual:true,
    lbpStatus:isExc?"with-pm":"with-pricer"});
  S.bids.unshift(b);
  if(isExc && !a.exception){
    a.track="Exception";
    a.exception={stage:"PM-intake",reason:(S._addDesc||"manual entry"),ask:"",performance:"",materials:[],submittedBy:d.who==="pm"?PM_OF[a.mgr]:null,submittedAt:null,decision:null,decisionNote:"",calc:null,draftSaved:false};
  }
  a.lastBy=(d.who==="pm"?PM_OF[a.mgr]:a.sp.split("@")[0]); a.lastAt=todayStamp();
  S.overlay=null;
  log(`Manual entry added on the Tracker — <b>${a.name}</b> · ${typeLabel(b.type)} (${b.id}).`, true);
  toast(`${a.name} added manually.`);
  render();
};
ACT["trk-sale-open"]=function(d){ const a=A(d.id); if(a.unread.sale){ a.unread.sale=false; log(`Sale read the result on <b>${a.name}</b>.`); } S.sel.saleAcct=d.id; render(); };
ACT["rep-clear"]=function(){ S.reportFilter={geo:"All",vertical:"All",excClass:"All"}; render(); };

render();
</script>
</body>
